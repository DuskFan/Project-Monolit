<title>Штаб Monolith</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Unbounded:wght@500;700;800&display=swap">
<style>
/* Layout: прорабский штаб — липкая шапка с вкладками, под ней один вид на всю ширину (max 1200px), фон — бетон с сеткой швов, прогресс — складной метр. */
:root{
  --bg:#E3E4E0; --surface:#F4F4F1; --surface-2:#EAEBE7; --ink:#1C1F23; --ink-2:#454A50; --muted:#6E747A;
  --line:#C8CAC5; --grout:rgba(28,31,35,.055);
  --orange:#E8590C; --orange-ink:#B54407; --btn-bg:#C94A06; --btn-fg:#FFFFFF;
  --yellow:#F2B705; --yellow-2:#E0A800; --yellow-ink:#7A5A00; --ruler-ink:#1C1F23;
  --ok:#2E7A4C; --ok-bg:#DCEBE1; --warn:#9A6408; --warn-bg:#F3E6C8; --bad:#AE2530; --bad-bg:#F3D9DB; --info:#2F5B86; --info-bg:#DCE5EF;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:5px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#131518; --surface:#1B1E22; --surface-2:#22262B; --ink:#ECEAE5; --ink-2:#BCBDBA; --muted:#8D9197;
  --line:#32373D; --grout:rgba(255,255,255,.03);
  --orange:#FF7A2E; --orange-ink:#FF9C5E; --btn-bg:#FF7A2E; --btn-fg:#131518;
  --yellow:#F5C230; --yellow-2:#D9A81C; --yellow-ink:#F5C230; --ruler-ink:#131518;
  --ok:#62C48A; --ok-bg:#1D3326; --warn:#E3B04B; --warn-bg:#3A2F17; --bad:#F07A82; --bad-bg:#3A1D20; --info:#7FB0E0; --info-bg:#1C2A39;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#131518; --surface:#1B1E22; --surface-2:#22262B; --ink:#ECEAE5; --ink-2:#BCBDBA; --muted:#8D9197;
  --line:#32373D; --grout:rgba(255,255,255,.03);
  --orange:#FF7A2E; --orange-ink:#FF9C5E; --btn-bg:#FF7A2E; --btn-fg:#131518;
  --yellow:#F5C230; --yellow-2:#D9A81C; --yellow-ink:#F5C230; --ruler-ink:#131518;
  --ok:#62C48A; --ok-bg:#1D3326; --warn:#E3B04B; --warn-bg:#3A2F17; --bad:#F07A82; --bad-bg:#3A1D20; --info:#7FB0E0; --info-bg:#1C2A39;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background-color:var(--bg);background-image:linear-gradient(var(--grout) 1px,transparent 1px),linear-gradient(90deg,var(--grout) 1px,transparent 1px);background-size:56px 56px;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:var(--orange-ink)}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- top ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:14px;padding-block:10px 6px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand b{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:.02em}
.brand span{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.top-stats{display:flex;gap:14px;margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.top-stats b{color:var(--ink);font-weight:600}
.save{display:inline-flex;align-items:center;gap:6px}
.save i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.save[data-s="ok"] i{background:var(--ok)} .save[data-s="busy"] i{background:var(--warn)} .save[data-s="err"] i{background:var(--bad)} .save[data-s="local"] i{background:var(--info)}
@media (max-width:560px){.top-stats .hide-sm{display:none}.top-stats{gap:10px;font-size:11.5px;margin-left:0}.save .lbl{display:none}}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:0 0 auto;text-decoration:none;color:var(--ink-2);font-weight:600;font-size:14px;padding:9px 12px 10px;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--orange)}
nav.tabs a small{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);margin-left:4px;font-weight:500}

main{padding-block:22px 80px}
.view{display:flex;flex-direction:column;gap:22px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{text-wrap:balance;margin:0}
.h1{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,4.2vw,38px);line-height:1.08;letter-spacing:-.005em}
.h2{font-family:var(--f-display);font-weight:700;font-size:clamp(17px,2.3vw,21px);line-height:1.2}
.h3{font-weight:700;font-size:16px;line-height:1.3}
.lead{font-size:16px;color:var(--ink-2);max-width:68ch;margin:6px 0 0}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--f-mono)}
.num{font-variant-numeric:tabular-nums}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-head > div{min-width:0}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel.flat{background:transparent;border-style:dashed}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:980px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sep{height:1px;background:var(--line);border:0;margin:4px 0}

/* buttons, chips */
.btn{font:600 13px/1.2 var(--f-body);display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:4px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.pri{background:var(--btn-bg);border-color:var(--btn-bg);color:var(--btn-fg)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 9px;font-size:12px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}
a.btn::after{content:"↗";font-weight:500;opacity:.7}
a.btn.noarrow::after{content:none}
.chip{display:inline-flex;align-items:center;gap:5px;font:500 11.5px/1 var(--f-mono);padding:4px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.chip.info{background:var(--info-bg);color:var(--info);border-color:transparent}
.chip.acc{background:var(--orange);color:var(--btn-fg);border-color:transparent}
.st[data-s="idea"]{background:var(--surface-2);color:var(--muted)}
.st[data-s="script"]{background:var(--info-bg);color:var(--info);border-color:transparent}
.st[data-s="frames"],.st[data-s="clips"],.st[data-s="edit"]{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.st[data-s="ready"]{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.st[data-s="published"]{background:var(--orange);color:var(--btn-fg);border-color:transparent}

/* tick checkbox: квадрат плитки */
input.tick{appearance:none;-webkit-appearance:none;width:22px;height:22px;border:2px solid var(--ink-2);border-radius:3px;background:var(--surface);display:inline-grid;place-content:center;cursor:pointer;flex:0 0 auto;margin:0}
input.tick::after{content:"";width:11px;height:6px;border-left:3px solid var(--btn-fg);border-bottom:3px solid var(--btn-fg);transform:rotate(-45deg) translate(1px,-1px);opacity:0}
input.tick:checked{background:var(--btn-bg);border-color:var(--btn-bg)}
input.tick:checked::after{opacity:1}

/* forms */
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-family:var(--f-mono);letter-spacing:.03em;min-width:0}
input[type=text],input[type=number],input[type=date],select,textarea{font:400 14px/1.4 var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{border-color:var(--orange);outline:none;box-shadow:0 0 0 2px color-mix(in srgb,var(--orange) 25%,transparent)}
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(6,minmax(0,1fr))}
.fgrid .c2{grid-column:span 2}.fgrid .c3{grid-column:span 3}.fgrid .c6{grid-column:span 6}.fgrid .c1{grid-column:span 1}
@media (max-width:760px){.fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.fgrid .c3,.fgrid .c6{grid-column:span 2}.fgrid .c2{grid-column:span 2}.fgrid .c1{grid-column:span 1}}

/* prompt blocks */
.prompt{position:relative;background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--yellow);border-radius:4px;padding:10px 12px;font:400 12.5px/1.55 var(--f-mono);white-space:pre-wrap;word-break:break-word;color:var(--ink-2);margin:0;max-height:320px;overflow:auto}
.prompt-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}

/* ruler (Zollstock) */
.ruler-wrap{overflow-x:auto;padding-bottom:4px}
.ruler{display:grid;grid-template-columns:repeat(20,minmax(22px,1fr));min-width:480px;position:relative}
.seg{height:34px;background:var(--yellow);border-right:1px solid color-mix(in srgb,var(--ruler-ink) 35%,transparent);position:relative;opacity:.28}
.seg:nth-child(even){background:var(--yellow-2)}
.seg.on{opacity:1}
.seg.plan{opacity:.55}
.seg::before{content:"";position:absolute;left:0;right:0;top:0;height:9px;background:repeating-linear-gradient(90deg,var(--ruler-ink) 0 1px,transparent 1px 20%)}
.seg span{position:absolute;bottom:3px;left:4px;font:600 11px/1 var(--f-mono);color:var(--ruler-ink)}
.seg:first-child{border-radius:3px 0 0 3px}.seg:last-child{border-radius:0 3px 3px 0;border-right:0}
.seg.mark::after{content:"";position:absolute;right:-2px;top:-6px;bottom:-6px;width:3px;background:var(--orange);z-index:2;border-radius:2px}
.ruler-labels{display:grid;grid-template-columns:repeat(20,minmax(22px,1fr));min-width:480px;font:500 11px/1.2 var(--f-mono);color:var(--muted);margin-top:8px}
.ruler-labels span{grid-column:span 1;white-space:nowrap}
.ruler-labels .ml{color:var(--orange-ink);font-weight:600}

/* stats */
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .k{font-size:12.5px;color:var(--muted)}
.bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--orange)}

/* next step */
.next{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;border:2px solid var(--orange);background:var(--surface);border-radius:var(--r);padding:16px 18px}
.next .tag{font:700 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;background:var(--orange);color:var(--btn-fg);padding:6px 8px;border-radius:3px}
@media (max-width:640px){.next{grid-template-columns:minmax(0,1fr)}}

/* phases timeline */
.phases{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.phase{border-top:4px solid var(--line);padding-top:10px}
.phase.now{border-top-color:var(--orange)}
.phase.done{border-top-color:var(--ok)}
.phase .d{font:500 12px var(--f-mono);color:var(--muted)}
@media (max-width:760px){.phases{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* board */
.board{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:8px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface-2);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:6px;min-height:80px}
.col h4{margin:0 0 2px;font:600 11px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.epcard{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:8px;text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.epcard:hover{border-color:var(--orange)}
.epcard b{font-size:13px;line-height:1.3}
.epcard span{font:500 11px var(--f-mono);color:var(--muted)}

/* insights */
.ins{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.ins .impl{border-top:1px dashed var(--line);padding-top:8px;font-size:14px}
.ins .impl b{color:var(--orange-ink)}
.src{display:flex;flex-wrap:wrap;gap:6px;font-size:12px}
.src a{font-family:var(--f-mono);font-size:11.5px;text-decoration:none;border-bottom:1px solid currentColor}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font:600 11px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.dots{display:inline-flex;gap:3px}.dots i{width:9px;height:9px;border-radius:2px;background:var(--surface-2);border:1px solid var(--line)}.dots i.on{background:var(--orange);border-color:var(--orange)}

/* tools */
.tool{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.tool.bought{border-color:var(--ok);box-shadow:inset 4px 0 0 var(--ok)}
.tool-h{display:flex;gap:12px;align-items:flex-start}
.tool-h > div{min-width:0;flex:1}
.tool .price{font:600 14px var(--f-mono);white-space:nowrap}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 10px;font-size:13.5px}
.kv dt{color:var(--muted);font-size:12px;font-family:var(--f-mono);padding-top:2px}
.kv dd{margin:0}
@media (max-width:480px){.kv{grid-template-columns:minmax(0,1fr)}.kv dt{padding-top:6px}}

/* steps */
.steps{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.step{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:16px;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.step.done{background:color-mix(in srgb,var(--ok-bg) 45%,var(--surface))}
.step.done .step-t{text-decoration:line-through;text-decoration-color:var(--ok);text-decoration-thickness:2px}
.step-n{font:600 11px var(--f-mono);color:var(--muted);letter-spacing:.06em}
.step-t{font-weight:700;font-size:15.5px;line-height:1.35}
.step-b{display:flex;flex-direction:column;gap:8px;min-width:0}
.step ol,.step ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:3px}
.callout{border-left:3px solid var(--orange);background:var(--surface-2);padding:8px 12px;border-radius:0 4px 4px 0;font-size:13.5px}
.callout.y{border-left-color:var(--yellow)}

/* scripts */
.sc{display:grid;grid-template-columns:270px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.sc{grid-template-columns:minmax(0,1fr)}}
.eplist{display:flex;flex-direction:column;gap:4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 104px)}
@media (max-width:900px){.eplist{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px}}
.epbtn{display:flex;flex-direction:column;gap:3px;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:8px 10px;cursor:pointer;min-width:0}
@media (max-width:900px){.epbtn{flex:0 0 190px}}
.epbtn[aria-pressed="true"]{border-color:var(--orange);box-shadow:inset 3px 0 0 var(--orange)}
.epbtn b{font-size:13.5px;line-height:1.25}
.epbtn .row{gap:6px}
.shots{width:100%;border-collapse:collapse;font-size:13.5px}
.shots th{font:600 10.5px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.shots td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.shots select,.shots input{font-size:13px;padding:6px 7px}
.shots .sn{font:700 13px var(--f-mono);color:var(--orange-ink);white-space:nowrap}
.shot-detail td{background:var(--surface-2)}
.shot-detail .fgrid{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:760px){
  .shots thead{display:none}
  .shots,.shots tbody,.shots tr,.shots td{display:block;width:100%}
  .shots tr.shot-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 10px;padding:10px;border-bottom:1px solid var(--line)}
  .shots tr.shot-row td{border:0;padding:0}
  .shots tr.shot-row td[data-l]::before{content:attr(data-l);display:block;font:600 10px/1.4 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .shots tr.shot-row td.wide{grid-column:span 2}
  .charpick{flex-direction:row}
  .tstack{min-width:0}
  .shot-detail .fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
.charpick{display:flex;gap:4px;flex-wrap:wrap;flex-direction:column;align-items:flex-start}
.tstack{display:flex;flex-direction:column;gap:5px;min-width:150px}
.tstack label{display:grid;grid-template-columns:46px minmax(0,1fr);align-items:center;gap:6px;font:500 10.5px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.shots td:nth-child(2){width:34%;min-width:180px}
.shots td:nth-child(2) input{width:100%}
.charpick label{display:inline-flex;align-items:center;gap:4px;font:500 11.5px var(--f-mono);border:1px solid var(--line);border-radius:999px;padding:3px 8px;cursor:pointer;background:var(--surface)}
.charpick input{margin:0;accent-color:var(--orange)}
.ai{border:1px dashed var(--orange);border-radius:var(--r);padding:14px;background:color-mix(in srgb,var(--orange) 6%,var(--surface))}
.ai pre{white-space:pre-wrap}
.hookpick{display:flex;flex-wrap:wrap;gap:6px}
.hookpick button{font:500 13px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 10px;cursor:pointer}
.hookpick button:hover{border-color:var(--orange)}

/* academy */
.lvl{display:grid;grid-template-columns:76px minmax(0,1fr);gap:16px}
.lvl-n{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1;color:var(--yellow-ink)}
@media (max-width:560px){.lvl{grid-template-columns:minmax(0,1fr)}.lvl-n{font-size:28px}}

/* misc */
.empty{border:2px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;color:var(--ink-2)}

const S = {
  view:"hq", mode:"loading", db:null, sample:null,

function normState(d){
  const base = {tools:{},steps:{},academy:{},decisions:{},retro:{},fieldNotes:""};
  const o = Object.assign({}, base, d||{});
  for (const k of ["tools","steps","academy","decisions","retro"]) if (typeof o[k]!=="object"||!o[k]) o[k]={};
  if (typeof o.fieldNotes!=="string") o.fieldNotes="";
  return o;
}
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = s => document.querySelector(s);
const byNum = (a,b) => (Number(a.num)||999)-(Number(b.num)||999);
const fmtD = d => d.toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit"});
const ep = id => S.episodes.find(e => e.id===id);
const opt = (list, v) => list.map(([k,l]) => `<option value="${esc(k)}"${k===v?" selected":""}>${esc(l)}</option>`).join("");

/* ===================== ХРАНЕНИЕ ===================== */
const LS_KEY = "monolith-hq-v1";
const dirty = new Set(), timers = {}, chains = {}, waiting = {};
function setSave(s){ S.saveS = s; rTop(); }
function queueSave(key, delay){
  if (S.readOnly) return;
  dirty.add(key); waiting[key]=true; setSave("busy");
  clearTimeout(timers[key]);
  timers[key] = setTimeout(() => flush(key), delay==null?650:delay);
}
function payload(key){
  if (key==="state") return {path:"hq/state", data:clone(S.state)};
  const e = ep(key.slice(3)); if (!e) return null;
  const d = clone(e); delete d.id; d.updatedAt = new Date().toISOString();
  return {path:"episodes/"+e.id, data:d};
}
function flush(key){
  clearTimeout(timers[key]); waiting[key]=false;
  const run = async () => {
    if (S.mode!=="db"){ saveLocal(); return; }
    const pl = payload(key); if (!pl) return;
    try { await S.db.doc(pl.path).set(pl.data); }
    catch(e){
      if (e && e.code==="unavailable"){ await new Promise(r=>setTimeout(r,700+Math.random()*900)); const p2=payload(key); if (p2) await S.db.doc(p2.path).set(p2.data); }
      else throw e;
    }
  };
  chains[key] = (chains[key]||Promise.resolve()).then(run).then(() => {
    if (!waiting[key]) dirty.delete(key);
    if (!dirty.size) setSave(S.mode==="db"?"ok":"local");
  }).catch(e => {
    dirty.delete(key);
    if (e && (e.code==="invalid_argument")) { S.readOnly = true; toast("Нет прав на запись — штаб в режиме просмотра"); }
    else if (e && e.code==="quota_exceeded") toast("База заполнена: удали лишние эпизоды");
    else toast("Не сохранилось. Проверь интернет и повтори действие");
    setSave("err");
  });
}
function saveLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify({state:S.state, episodes:S.episodes})); } catch(e){} }
function loadLocal(){
  try { const raw = localStorage.getItem(LS_KEY); if (raw){ const d = JSON.parse(raw); S.state = normState(d.state); S.episodes = (d.episodes||[]).sort(byNum);} } catch(e){}
}
function setPath(obj, path, val){ const ks = path.split("."); let o = obj; for (let i=0;i<ks.length-1;i++){ if (typeof o[ks[i]]!=="object"||!o[ks[i]]) o[ks[i]]={}; o=o[ks[i]]; } o[ks[ks.length-1]] = val; }
function getPath(obj, path){ return path.split(".").reduce((o,k)=> (o&&typeof o==="object")?o[k]:undefined, obj); }
function stSet(path, val){ setPath(S.state, path, val); queueSave("state"); }

async function boot(){
  route(); renderAll();
  const c = window.claude;
  if (!c || typeof c.use!=="function"){ S.mode="local"; loadLocal(); setSave("local"); renderAll(); return; }
  c.use("sample").then(s => { S.sample = s||null; if (S.view==="scripts") render(); }).catch(()=>{});
  let db = null;
  try { db = await c.use("db"); } catch(e){ db = null; }
  if (!db){ S.mode="local"; loadLocal(); setSave("local"); renderAll(); return; }
  S.db = db; S.mode = "db";
  db.doc("hq/state").onSnapshot(snap => {
    if (!dirty.has("state")) S.state = normState(snap.exists ? clone(snap.data()) : {});
    S.loadedState = true; if (!dirty.size) setSave("ok"); scheduleRender();
  }, onDbErr);
  db.collection("episodes").onSnapshot(qs => {
    const m = new Map();
    qs.docs.forEach(d => { const o = clone(d.data()||{}); o.id = d.id; if (!Array.isArray(o.shots)) o.shots=[]; m.set(d.id, o); });
    for (const k of dirty) if (k.startsWith("ep:")){ const loc = ep(k.slice(3)); if (loc) m.set(loc.id, loc); }
    S.episodes = [...m.values()].sort(byNum);
    S.loadedEps = true; scheduleRender();
  }, onDbErr);
}
function onDbErr(e){ setSave("err"); if (e && e.code==="revoked") S.readOnly = true; scheduleRender(); }

function stats(){
  const pub = S.episodes.filter(e=>e.status==="published").length;
  const months = pub>=10 ? 1+Math.floor((pub-10)/5) : 0;
  const now = new Date(); const days = Math.max(0, Math.ceil((DEADLINE-now)/86400000));
  let spent = 0;
  for (const t of TOOLS){ const s = S.state.tools[t.id]; if (s&&s.bought){ const v = (s.paid!=null && s.paid!=="") ? Number(s.paid) : t.price*(t.cur==="$"?USD_EUR:1); spent += isFinite(v)?v:0; } }
  return {pub, months, days, spent};
}
function rTop(){
  const st = stats();

  const eps = S.episodes.filter(e=>e.status!=="published").sort(byNum);
  for (const e of eps){
    const g = e.gen||{};
    const step = CYCLE.find(c => !g[c.id]);
    if (step) return {tag:"EP"+String(e.num).padStart(2,"0"), t:step.t+" · "+e.title, d:"Плановая дата: "+(e.plannedAt?fmtD(new Date(e.plannedAt)):"не назначена"), go:"gen", ep:e.id, anchor:step.id};
  }

/* ---------- ПРОМПТЫ ---------- */
function charBlocks(chars){ return (chars||[]).filter(c=>CHARS[c]).map(c=>CHARS[c].block).join("\n"); }
function kfPrompt(sh){
  const ch = (sh.chars||[]).filter(c=>CHARS[c]);
  const ref = ch.length ? `Use the attached reference image(s) for ${ch.map(c=>CHARS[c].name).join(", ")}. Keep every design detail identical.\n` : "";
  return `${ref}Create one still frame, vertical 9:16, that will be the FIRST frame of an animated shot.\nSCENE: ${sh.action||"(опиши действие)"}${sh.camera?`\nFRAMING: ${sh.camera}`:""}\n${charBlocks(ch)}${ch.length?"\n":""}${WORLD}\n${STYLE}`;
}
function vidPrompt(sh){
  const ch = (sh.chars||[]).filter(c=>CHARS[c]);
  const line = sh.line ? `Herr Zollstock says in German: "${sh.line}". ` : "";
  return `${charBlocks(ch)}${ch.length?"\n":""}ACTION: ${sh.action||"(опиши действие)"}\nCAMERA: ${sh.camera||"static medium shot"}\nKeep the characters exactly as in the first frame. Tiles and grout lines stay perfectly rigid and straight.\n${STYLE}\nAUDIO: ${line}${sh.audio||"cartoon sound effects only"}. No background music.\nDuration: about ${Number(sh.dur)||4} seconds.`;
}
function promptBox(label, text, id){
  return `<div><div class="prompt-head"><span class="eyebrow">${esc(label)}</span><button class="btn sm" data-act="copy" data-src="${id}">Копировать</button></div><pre class="prompt" id="${id}">${esc(text)}</pre></div>`;
}

function rAI(e, ai){
  if (ai.busy) return `<div class="ai stack"><div class="row" style="justify-content:space-between"><b>Claude думает…</b><button class="btn sm" data-act="ai-stop">Стоп</button></div><p class="small muted">${ai.chars?`Пишет: ${ai.chars} символов`:"Первый ответ обычно через 10–60 секунд."}</p></div>`;
  if (ai.err) return `<div class="ai"><p class="small">${esc(ai.err)}</p></div>`;
  const r = ai.result || {};
  let h = `<div class="ai stack"><div class="row" style="justify-content:space-between"><b>Предложение Claude</b><button class="btn sm ghost" data-act="ai-close" data-id="${esc(e.id)}">Закрыть</button></div>`;
  const hk = r.hooks || r;
  if ((hk.ro&&hk.ro.length)||(hk.ru&&hk.ru.length)){
    h += `<div class="stack"><span class="eyebrow">Хуки — нажми, чтобы взять</span>
      <div class="hookpick">${(hk.ro||[]).map(t=>`<button data-act="take-hook" data-id="${esc(e.id)}" data-l="hookRo" data-text="${esc(t)}"><span class="mono muted small">RO</span> ${esc(t)}</button>`).join("")}</div>
      <div class="hookpick">${(hk.ru||[]).map(t=>`<button data-act="take-hook" data-id="${esc(e.id)}" data-l="hookRu" data-text="${esc(t)}"><span class="mono muted small">RU</span> ${esc(t)}</button>`).join("")}</div></div>`;
  }
  if (Array.isArray(r.shots) && r.shots.length){
    h += `<div class="stack"><span class="eyebrow">Раскадровка · ${r.shots.length} кадр.</span><ol class="small" style="margin:0;padding-left:20px">${r.shots.map(s=>`<li><b>${esc(s.desc||"")}</b> <span class="muted">(${esc(s.dur||4)} с${s.line?` · «${esc(s.line)}»`:""})</span></li>`).join("")}</ol>
      ${r.punchline?`<p class="small"><b>Панчлайн:</b> ${esc(r.punchline)}</p>`:""}

/* ===================== ДЕЙСТВИЯ ===================== */
function toast(t){ const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(()=>el.classList.remove("on"), 1800); }
function copy(text){
  const done = () => toast("Скопировано");
  try { navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text)); } catch(e){ fallbackCopy(text); }
}
function fallbackCopy(text){
  const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand("copy"); } catch(e){}
  ta.remove(); toast(ok?"Скопировано":"Не удалось скопировать — выдели текст вручную");
}
function newId(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function newShot(){ return {id:newId("s"), desc:"", chars:["monolith"], action:"", camera:"static medium shot", audio:"", line:"", kfTool:"nano", vidTool:"veo-flow", sfxTool:"veo", dur:4, status:"todo", note:""}; }
function createEp(){
  if (S.readOnly) return;
  const num = S.episodes.reduce((m,x)=>Math.max(m,Number(x.num)||0),0)+1;
  const e = {id:"ep"+String(num).padStart(2,"0")+"-"+Math.random().toString(36).slice(2,6), num, title:"Новый эпизод", format:"sketch", status:"idea", plannedAt:"", hookRo:"", hookRu:"", idea:"", punchline:"", germanLine:"", captionRo:"", captionRu:"", notes:"", shots:[], gen:{}, metrics:{}};
  S.episodes.push(e); S.episodes.sort(byNum); S.sel = e.id; S.view="scripts"; location.hash="scripts";
  queueSave("ep:"+e.id, 0); renderAll();
}
async function aiRun(e, kind){
  if (!S.sample || S.aiBusy) return;
  const ctl = new AbortController(); S.aiCtl = ctl; S.aiBusy = e.id;
  S.ai[e.id] = {busy:true, chars:0}; render();
  const bible = Object.values(CHARS).map(c=>"- "+c.block).join("\n");
  const ctx = `EPISODE\nTitle: ${e.title}\nFormat: ${(FORMATS.find(x=>x[0]===e.format)||["",""])[1]}\nIdea (Russian): ${e.idea||"-"}\nPunchline (Russian): ${e.punchline||"-"}\nGerman line for Herr Zollstock: ${e.germanLine||"-"}\nCurrent hooks: RO "${e.hookRo||""}" / RU "${e.hookRu||""}"\nNotes: ${e.notes||"-"}`;
  const base = `You are the head writer and storyboard artist of "Monolith", a TikTok cartoon series in a stylized 3D animated look, generated shot by shot with Google Veo 3.1 from keyframe images.\nAUDIENCE: Romanian, Moldovan and Russian-speaking construction workers living in Germany, watching in the evening after their shift. The humour is recognition of life on a German construction site (strict German boss, Feierabend, "nur noch kurz", pedantry, payslips, Monday mornings), satisfying tile work and absurd punchlines. Affectionate workplace humour only, never insulting any nationality.\nCHARACTERS:\n${bible}\n`;
  let prompt, isShots = kind==="shots";
  if (isShots){
    prompt = base + `RULES:\n- 3 to 5 shots. Each shot is ONE simple visual action, 2-6 seconds, total 12-25 seconds.\n- Shot 1 is the hook: the conflict is visible in the first 2 seconds.\n- No complex hand actions. No readable text, letters, numbers or logos inside the image (they are added later in the editor).\n- Each shot must be generatable on its own from one keyframe.\n- The last shot is a clear punchline; if possible it loops back to the first shot.\n- Herr Zollstock may say 1-4 German words; Monolith and Kachel never speak words.\n${ctx}\nReply with only JSON in this shape:\n{"hooks":{"ro":["3 Romanian on-screen hooks, max 7 words"],"ru":["3 Russian on-screen hooks, max 7 words"]},"punchline":"one sentence in Russian","shots":[{"desc":"short Russian description","chars":["monolith","zollstock","kachel"],"action":"one visual English sentence","camera":"short English camera note","audio":"English sound effects, no music","line":"German words for Herr Zollstock or empty string","dur":4}],"captionRo":"one Romanian caption line","captionRu":"one Russian caption line"}\nUse only these character ids: monolith, zollstock, kachel.`;
  } else {
    prompt = base + ctx + `\nWrite 5 on-screen hooks in Romanian and 5 in Russian for this episode. Max 7 words each. Recognition style ("Când..." / "Когда...", "POV: ..."). They must make a worker stop scrolling in under 2 seconds.\nReply with only JSON: {"ro":["..."],"ru":["..."]}`;
  }
  try {
    const res = await S.sample.json(prompt, {signal:ctl.signal, onText:({text})=>{ const a = S.ai[e.id]; if (a&&a.busy){ a.chars = text.length; const el = document.querySelector(".ai .muted"); if (el) el.textContent = "Пишет: "+text.length+" символов"; } }});
    S.ai[e.id] = {result: isShots ? res : {hooks:res}};
  } catch(err){
    const code = err && err.code;
    const msg = {cancelled:"Остановлено.", not_granted:"Доступ к Claude для штаба не разрешён. Разреши в окне запроса или пиши мне в чат.", sampling_disabled:"Claude недоступен для этого аккаунта.", rate_limited:"Слишком много запросов или кончился лимит. Попробуй позже.", invalid_json:"Ответ пришёл не в том формате. Нажми ещё раз.", refused:"Claude отказался от такого запроса. Перефразируй идею."}[code] || "Не получилось. Попробуй ещё раз.";
    S.ai[e.id] = code==="cancelled" ? null : {err:msg};
    if (code==="not_granted"||code==="sampling_disabled") S.sample = null;
  } finally { S.aiBusy = null; S.aiCtl = null; render(); }
}
function applyAIShots(e){
  const r = (S.ai[e.id]||{}).result; if (!r||!Array.isArray(r.shots)) return;
  e.shots = r.shots.slice(0,8).map(s=>{ const sh = newShot(); return Object.assign(sh, {
    desc:String(s.desc||""), chars:(Array.isArray(s.chars)?s.chars:[]).map(String).filter(c=>CHARS[c]),
    action:String(s.action||""), camera:String(s.camera||"static medium shot"), audio:String(s.audio||""),
    line:String(s.line||""), dur:Math.max(1,Math.min(8,Number(s.dur)||4)) }); });
  if (r.punchline && !e.punchline) e.punchline = String(r.punchline);
  if (e.status==="idea") e.status = "script";
  queueSave("ep:"+e.id, 0); toast("Кадры добавлены"); render();
}

document.addEventListener("click", ev => {
  const a = ev.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act;
  if (a.tagName==="INPUT" || a.tagName==="SELECT") return; // обрабатываются в change
  const e = a.dataset.id ? ep(a.dataset.id) : (a.dataset.ep ? ep(a.dataset.ep) : null);
  const shot = (e && a.dataset.shot) ? (e.shots||[]).find(s=>s.id===a.dataset.shot) : null;
  switch(act){
    case "go": {
      if (a.dataset.ep){ S.genEp = a.dataset.ep; S.sel = a.dataset.ep; }
      if (location.hash==="#"+a.dataset.go){ route(); renderAll(); } else location.hash = a.dataset.go;
      const anc = a.dataset.anchor;
      if (anc) setTimeout(()=>{ const el = document.getElementById("step-"+anc); if (el) el.scrollIntoView({behavior:"smooth",block:"center"}); }, 60);
      break; }
    case "open-ep": S.sel = a.dataset.id; location.hash = "scripts"; break;
    case "sel-ep": S.sel = a.dataset.id; S.confirm = null; render(); break;
    case "new-ep": createEp(); break;
    case "del-ep":
      if (S.confirm==="ep:"+e.id){ S.confirm=null; S.episodes = S.episodes.filter(x=>x.id!==e.id); dirty.delete("ep:"+e.id); clearTimeout(timers["ep:"+e.id]);
        if (S.mode==="db") S.db.doc("episodes/"+e.id).delete().catch(()=>toast("Не удалось удалить")); else saveLocal();
        S.sel = null; toast("Эпизод удалён"); renderAll(); }
      else { S.confirm = "ep:"+e.id; render(); setTimeout(()=>{ if (S.confirm==="ep:"+e.id){ S.confirm=null; if(!editing()) render(); } }, 4000); }
      break;
    case "add-shot": { e.shots = e.shots||[]; const sh = newShot(); e.shots.push(sh); S.openShots.add(e.id+":"+sh.id); queueSave("ep:"+e.id); render(); break; }
    case "toggle-shot": { const k = e.id+":"+a.dataset.shot; S.openShots.has(k)?S.openShots.delete(k):S.openShots.add(k); render(); break; }
    case "shot-up": case "shot-down": { const i = e.shots.findIndex(s=>s.id===a.dataset.shot), j = act==="shot-up"?i-1:i+1; if (i<0||j<0||j>=e.shots.length) break; [e.shots[i],e.shots[j]]=[e.shots[j],e.shots[i]]; queueSave("ep:"+e.id); render(); break; }
    case "shot-del":
      if (S.confirm==="shot:"+a.dataset.shot){ S.confirm=null; e.shots = e.shots.filter(s=>s.id!==a.dataset.shot); queueSave("ep:"+e.id); render(); }
      else { S.confirm = "shot:"+a.dataset.shot; render(); setTimeout(()=>{ if (S.confirm==="shot:"+a.dataset.shot){ S.confirm=null; if(!editing()) render(); } }, 4000); }
      break;
    case "shot-status": if (shot){ shot.status = a.dataset.v; queueSave("ep:"+e.id); toast("Статус кадра обновлён"); render(); } break;
    case "copy": { const el = document.getElementById(a.dataset.src); if (el) copy(el.textContent); break; }
    case "copy-text": copy(a.dataset.text||""); break;
    case "copy-all": { const t = (e.shots||[]).map((s,i)=>`===== S${i+1} · ${s.desc||""} =====\n--- KEYFRAME ---\n${kfPrompt(s)}\n\n--- VIDEO ---\n${vidPrompt(s)}`).join("\n\n"); copy(t); break; }
    case "ai-shots": aiRun(e,"shots"); break;
    case "ai-hooks": aiRun(e,"hooks"); break;
    case "ai-stop": if (S.aiCtl) S.aiCtl.abort(); break;
    case "ai-close": S.ai[e.id] = null; render(); break;
    case "ai-apply": applyAIShots(e); break;
    case "ai-caption": { const r = (S.ai[e.id]||{}).result||{}; if (r.captionRo) e.captionRo = String(r.captionRo); if (r.captionRu) e.captionRu = String(r.captionRu); queueSave("ep:"+e.id); render(); break; }
    case "take-hook": e[a.dataset.l] = a.dataset.text; queueSave("ep:"+e.id); toast("Хук взят"); render(); break;
    case "hook-lang": S.hookLang = a.dataset.l; render(); break;
    case "timer":
      if (S.timer.run){ clearInterval(S.timer.h); S.timer.run=false; }
      else { if (S.timer.left===0) S.timer.left=1800; S.timer.run=true; S.timer.h=setInterval(()=>{ S.timer.left=Math.max(0,S.timer.left-1); if (S.timer.left===0){ clearInterval(S.timer.h); S.timer.run=false; toast("30 минут вышли. Закрой ленту."); } if (S.view==="intel" && !editing()){ const el=document.querySelector(".timer"); if (el) el.textContent=String(Math.floor(S.timer.left/60)).padStart(2,"0")+":"+String(S.timer.left%60).padStart(2,"0"); if (!S.timer.run) render(); } },1000); }
      render(); break;
    case "timer-reset": clearInterval(S.timer.h); S.timer={left:1800,run:false,h:null}; render(); break;
  }
});

document.addEventListener("change", ev => {
  const t = ev.target;
  if (t.dataset.act==="tool-bought"){
    const id = t.dataset.id; const cur = S.state.tools[id]||{};
    const nx = Object.assign({}, cur, {bought:t.checked});
    if (t.checked && !cur.cancelBy){ const d = new Date(); d.setDate(d.getDate()+29); nx.cancelBy = d.toISOString().slice(0,10); nx.boughtAt = new Date().toISOString().slice(0,10); }
    S.state.tools[id] = nx; queueSave("state"); renderAll(); return;
  }
  if (t.dataset.act==="gen-step"){ const e = ep(t.dataset.ep); if (!e) return; e.gen = e.gen||{}; e.gen[t.dataset.step] = t.checked; queueSave("ep:"+e.id); renderAll(); return; }
  if (t.dataset.act==="shot-char"){ const e = ep(t.dataset.ep); const s = e&&(e.shots||[]).find(x=>x.id===t.dataset.shot); if (!s) return; const set = new Set(s.chars||[]); t.checked?set.add(t.dataset.c):set.delete(t.dataset.c); s.chars=[...set]; queueSave("ep:"+e.id); render(); return; }
  if (t.dataset.act==="gen-ep"){ S.genEp = t.value; render(); return; }
  if (t.dataset.st && (t.type==="checkbox")){ stSet(t.dataset.st, t.checked); renderAll(); return; }
  if (t.tagName==="SELECT" && (t.dataset.st || t.dataset.ep)){ handleInput(t); renderAll(); return; }
  if (t.type==="date"){ handleInput(t); setTimeout(()=>{ if(!editing()) renderAll(); },0); return; }
  if (/^(INPUT|TEXTAREA)$/.test(t.tagName)) setTimeout(()=>{ if (!editing()) renderAll(); }, 300);
});
document.addEventListener("input", ev => { const t = ev.target; if (t.type==="checkbox"||t.tagName==="SELECT"||t.type==="date") return; handleInput(t); });
function handleInput(t){
  if (t.dataset.st){ let v = t.value; if (t.type==="number") v = v===""?null:Number(v); stSet(t.dataset.st, v); if (t.dataset.st.startsWith("tools.")) rTop(); return; }
  const e = t.dataset.ep ? ep(t.dataset.ep) : null; if (!e) return;
  if (t.dataset.metric){ e.metrics = e.metrics||{}; e.metrics[t.dataset.metric] = t.value===""?null:Number(t.value); queueSave("ep:"+e.id, 900); return; }
  const f = t.dataset.f; if (!f) return;
  let v = t.value; if (t.type==="number") v = v===""?null:Number(v);
  if (t.dataset.shot){ const s = (e.shots||[]).find(x=>x.id===t.dataset.shot); if (!s) return; s[f] = v; }
  else { e[f] = v; if (f==="status" && v==="published" && !e.publishedAt) e.publishedAt = new Date().toISOString().slice(0,10); }
  queueSave("ep:"+e.id);
}
document.addEventListener("focusout", () => { setTimeout(()=>{ if (S.pending && !editing()) renderAll(); }, 300); });

function route(){
  const h = (location.hash||"").replace("#","");
  S.view = TABS.some(t=>t[0]===h) ? h : "hq";
}
window.addEventListener("hashchange", () => { route(); S.confirm=null; renderAll(); window.scrollTo(0,0); });
boot();
</script>
