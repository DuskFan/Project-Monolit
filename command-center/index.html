<title>Штаб Monolith</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=JetBrains+Mono:wght@400;500;700&family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Layout: оперативный штаб — слева рейка управления (на телефоне — верхняя шапка), справа рабочее поле с телеметрией; фон — базальт с осевой сеткой строительного плана. Одна тёмная тема намеренно: это ночной штаб. */
:root{
  --bg:#0E1012; --bg-2:#111417; --pn:#15181B; --pn-2:#1B1F23; --pn-3:#22272C;
  --seam:#2A2F35; --seam-2:#3B4148;
  --tx:#ECE5D8; --tx-2:#B5AEA1; --tx-3:#7E796F;
  --amber:#E8821E; --amber-2:#B9661A; --amber-ink:#17100A; --amber-soft:rgba(232,130,30,.12);
  --laser:#FF5A3C; --blue:#8DAFCD; --blue-soft:rgba(141,175,205,.12);
  --ok:#93C391; --ok-soft:rgba(147,195,145,.13); --bad:#E58468; --bad-soft:rgba(229,132,104,.13);
  --f-display:"Forum","Times New Roman",Georgia,serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background-color:var(--bg);background-image:radial-gradient(ellipse at 70% -10%,rgba(232,130,30,.06),transparent 55%),linear-gradient(rgba(236,229,216,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(236,229,216,.028) 1px,transparent 1px);background-size:100% 100%,64px 64px,64px 64px;background-attachment:fixed;color:var(--tx);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
a{color:var(--amber)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
::selection{background:var(--amber);color:var(--amber-ink)}

/* ---------- каркас ---------- */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:18px;padding-block:22px 18px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:18px;border-right:1px solid var(--seam);background:linear-gradient(180deg,rgba(21,24,27,.92),rgba(14,16,18,.96));z-index:30;overflow-y:auto}
.brand{display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--tx)}
.brand svg{flex:0 0 auto}
.plaque{display:inline-grid;place-items:center;background:linear-gradient(135deg,#F1EBDF,#DDD4C4);border-radius:2px;padding:6px 8px;box-shadow:0 6px 18px rgba(0,0,0,.35),inset 0 0 0 1px rgba(0,0,0,.06);flex:0 0 auto}
.plaque svg{display:block;max-width:100%;height:auto}
.logo-box.light{background:#ECE5D8;border-color:#D6CDBE}
.brand b{display:block;font:400 21px/1 var(--f-display);letter-spacing:.16em}
.brand span{display:block;font:500 10px/1.4 var(--f-mono);letter-spacing:.14em;color:var(--tx-3);text-transform:uppercase;margin-top:4px}
nav.nav{display:flex;flex-direction:column;gap:2px}
nav.nav a{display:grid;grid-template-columns:22px minmax(0,1fr) auto;align-items:center;gap:8px;padding:9px 10px;border-radius:2px;color:var(--tx-2);text-decoration:none;font-weight:500;font-size:14.5px;border:1px solid transparent}
nav.nav a kbd{font:500 10.5px var(--f-mono);color:var(--tx-3);border:1px solid var(--seam-2);border-radius:2px;width:20px;height:20px;display:grid;place-items:center}
nav.nav a small{font:500 10.5px var(--f-mono);color:var(--tx-3)}
nav.nav a:hover{color:var(--tx);background:var(--pn)}
nav.nav a[aria-current="page"]{color:var(--tx);background:var(--pn-2);border-color:var(--seam-2);box-shadow:inset 2px 0 0 var(--amber)}
nav.nav a[aria-current="page"] kbd{color:var(--amber);border-color:var(--amber-2)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;font:500 11px/1.4 var(--f-mono);color:var(--tx-3);letter-spacing:.04em}
.rail-foot .clock{font:500 22px/1 var(--f-mono);color:var(--tx);letter-spacing:.02em}
.save{display:inline-flex;align-items:center;gap:7px}
.save i{width:7px;height:7px;border-radius:50%;background:var(--tx-3)}
.save[data-s="ok"] i{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.save[data-s="busy"] i{background:var(--amber)}
.save[data-s="err"] i{background:var(--bad)}
.save[data-s="local"] i{background:var(--blue)}
.main{min-width:0;padding-block:0 90px;padding-left:36px;padding-right:max(36px,env(safe-area-inset-right,0px))}
.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:22px;align-items:center;flex-wrap:wrap;padding:12px 0;margin-bottom:26px;background:linear-gradient(180deg,var(--bg) 70%,rgba(14,16,18,0));font:500 12px var(--f-mono);color:var(--tx-3);letter-spacing:.04em}
.strip b{color:var(--tx);font-weight:500}
.strip .hot b{color:var(--amber)}
.strip .sep{flex:1}
.laser-sweep{position:fixed;top:env(safe-area-inset-top,0px);left:0;height:2px;width:100%;background:linear-gradient(90deg,transparent,var(--laser) 40%,#FFB199 50%,var(--laser) 60%,transparent);box-shadow:0 0 12px var(--laser);transform:translateX(-100%);animation:sweep 1.6s .2s cubic-bezier(.6,.1,.2,1) forwards;z-index:60;pointer-events:none}
@keyframes sweep{to{transform:translateX(100%)}}

@media (max-width:980px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;height:auto;flex-direction:column;gap:10px;padding-block:12px 0;padding-right:max(16px,env(safe-area-inset-right,0px));padding-left:max(16px,env(safe-area-inset-left,0px));border-right:0;border-bottom:1px solid var(--seam);overflow:visible}
  nav.nav{flex-direction:row;overflow-x:auto;scrollbar-width:none;gap:4px;padding-bottom:10px}
  nav.nav::-webkit-scrollbar{display:none}
  nav.nav a{flex:0 0 auto;grid-template-columns:auto auto;padding:7px 10px;font-size:13.5px}
  nav.nav a kbd{display:none}
  .rail-foot{display:none}
  .brand b{font-size:18px}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .strip{position:static;gap:12px;font-size:11px;margin-bottom:14px}
  .strip .opt{display:none}
}

/* ---------- типографика ---------- */
.view{display:flex;flex-direction:column;gap:26px}
.sh{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end;border-bottom:1px solid var(--seam);padding-bottom:18px}
.sh .code{font:500 11px var(--f-mono);letter-spacing:.18em;color:var(--amber);text-transform:uppercase}
.sh h1{font:400 clamp(34px,5.6vw,64px)/.98 var(--f-display);letter-spacing:.05em;text-transform:uppercase;margin:8px 0 0;text-wrap:balance}
.sh p{color:var(--tx-2);max-width:66ch;margin:12px 0 0;font-size:16px}
.tb{display:grid;grid-template-columns:repeat(2,auto);border:1px solid var(--seam-2);font:500 10px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--tx-3)}
.tb span{padding:5px 9px;border-right:1px solid var(--seam-2);border-bottom:1px solid var(--seam-2)}
.tb span:nth-child(2n){border-right:0}
.tb span:nth-last-child(-n+2){border-bottom:0}
.tb b{display:block;color:var(--tx-2);font-weight:500}
@media (max-width:760px){.sh{grid-template-columns:minmax(0,1fr)}.tb{display:none}}
h2,h3{margin:0;text-wrap:balance}
.h2{font:400 clamp(22px,2.8vw,30px)/1.1 var(--f-display);letter-spacing:.05em;text-transform:uppercase}
.h3{font-weight:600;font-size:16px;line-height:1.3}
.eb{font:500 11px/1.3 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--tx-3)}
.eb.a{color:var(--amber)}
p{margin:0}
.mut{color:var(--tx-3)} .t2{color:var(--tx-2)} .sm{font-size:13.5px} .xs{font-size:12px}
.mono{font-family:var(--f-mono)} .num{font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.between{justify-content:space-between}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}

/* ---------- панели ---------- */
.pn{background:var(--pn);border:1px solid var(--seam);border-radius:2px;padding:20px;min-width:0;position:relative}
.pn.mk::before,.pn.mk::after{content:"";position:absolute;width:12px;height:12px;border-color:var(--amber-2);border-style:solid;pointer-events:none}
.pn.mk::before{top:-1px;left:-1px;border-width:2px 0 0 2px}
.pn.mk::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0}
.pn.ghost{background:transparent;border-style:dashed}
.callout{border-left:2px solid var(--amber);background:var(--amber-soft);padding:10px 14px;font-size:14px;color:var(--tx)}
.callout.b{border-left-color:var(--blue);background:var(--blue-soft)}
.callout.r{border-left-color:var(--bad);background:var(--bad-soft)}

/* ---------- кнопки, чипы, поля ---------- */
.btn{font:600 12.5px/1.2 var(--f-body);letter-spacing:.02em;display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border-radius:2px;border:1px solid var(--seam-2);background:var(--pn-2);color:var(--tx);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--tx-3);background:var(--pn-3)}
.btn.pri{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.btn.pri:hover{background:#F59A45}
.btn.ghost{background:transparent}
.btn.s{padding:6px 10px;font-size:12px}
.btn.xl{padding:13px 20px;font-size:14px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:default}
a.btn::after{content:"↗";font-weight:500;opacity:.65}
a.btn.in::after{content:none}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 11px/1 var(--f-mono);letter-spacing:.03em;padding:5px 8px;border-radius:2px;background:var(--pn-3);color:var(--tx-2);white-space:nowrap}
.chip.a{background:var(--amber);color:var(--amber-ink)}
.chip.o{background:var(--ok-soft);color:var(--ok)}
.chip.b{background:var(--blue-soft);color:var(--blue)}
.chip.r{background:var(--bad-soft);color:var(--bad)}
.chip.line{background:transparent;border:1px solid var(--seam-2)}
input.tick{appearance:none;-webkit-appearance:none;width:22px;height:22px;border:1.5px solid var(--tx-3);border-radius:2px;background:var(--bg);display:inline-grid;place-content:center;cursor:pointer;flex:0 0 auto;margin:0}
input.tick::after{content:"";width:11px;height:6px;border-left:2.5px solid var(--amber-ink);border-bottom:2.5px solid var(--amber-ink);transform:rotate(-45deg) translate(1px,-1px);opacity:0}
input.tick:checked{background:var(--amber);border-color:var(--amber)}
input.tick:checked::after{opacity:1}
label.f{display:flex;flex-direction:column;gap:5px;font:500 10.5px/1.3 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--tx-3);min-width:0}
input[type=text],input[type=number],input[type=date],select,textarea{font:400 14px/1.45 var(--f-body);color:var(--tx);background:var(--bg-2);border:1px solid var(--seam-2);border-radius:2px;padding:9px 11px;width:100%;min-width:0;letter-spacing:0;text-transform:none}
select{appearance:none;-webkit-appearance:none;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,var(--tx-3) 50%),linear-gradient(135deg,var(--tx-3) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat}
textarea{resize:vertical;min-height:72px}
input:focus,select:focus,textarea:focus{border-color:var(--amber);outline:none;box-shadow:0 0 0 3px var(--amber-soft)}
.fg{display:grid;gap:14px;grid-template-columns:repeat(6,minmax(0,1fr))}
.fg .c1{grid-column:span 1}.fg .c2{grid-column:span 2}.fg .c3{grid-column:span 3}.fg .c4{grid-column:span 4}.fg .c6{grid-column:span 6}
@media (max-width:760px){.fg{grid-template-columns:repeat(2,minmax(0,1fr))}.fg .c2,.fg .c3,.fg .c4,.fg .c6{grid-column:span 2}.fg .c1{grid-column:span 1}}

/* ---------- промпты ---------- */
.pr-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.prompt{background:var(--bg);border:1px solid var(--seam);border-left:2px solid var(--laser);border-radius:2px;padding:11px 13px;font:400 12.5px/1.6 var(--f-mono);white-space:pre-wrap;word-break:break-word;color:var(--tx-2);margin:0;max-height:300px;overflow:auto}

/* ---------- штаб ---------- */
.order{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;align-items:center;padding:26px}
.order .tag{display:inline-flex;gap:8px;align-items:center;font:700 11px var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--amber)}
.order .tag::before{content:"";width:8px;height:8px;background:var(--laser);border-radius:50%;box-shadow:0 0 10px var(--laser);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
.order h2{font:400 clamp(26px,3.6vw,40px)/1.06 var(--f-display);letter-spacing:.04em;text-transform:uppercase;margin:10px 0 6px}
.queue{display:flex;flex-direction:column;border-top:1px solid var(--seam);margin-top:4px}
.queue div{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;padding:9px 0;border-bottom:1px solid var(--seam);font-size:14px;align-items:center}
.queue i{font:500 11px var(--f-mono);color:var(--tx-3);font-style:normal}
@media (max-width:640px){.order{grid-template-columns:minmax(0,1fr);padding:18px}}
.tminus{font:500 clamp(30px,4.4vw,48px)/1 var(--f-mono);letter-spacing:.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.tminus span{color:var(--tx-3);font-size:.5em;margin:0 .3em 0 .1em}
.slots{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.slots i{height:30px;border:1px solid var(--seam-2);background:var(--bg-2);position:relative}
.slots i.on{background:var(--amber);border-color:var(--amber)}
.slots i.wip{background:linear-gradient(0deg,rgba(232,130,30,.35) var(--p,0%),var(--bg-2) var(--p,0%));border-color:var(--amber-2)}
.big{font:400 46px/1 var(--f-display);letter-spacing:.02em}
.big small{font:500 14px var(--f-mono);color:var(--tx-3);margin-left:6px;letter-spacing:0}
.bar{height:4px;background:var(--pn-3);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--amber)}
.quota{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.qc{border:1px solid var(--seam);padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg-2)}
.qc .n{font:500 26px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.qc .n small{font-size:13px;color:var(--tx-3)}
.qc .row button{flex:1}
@media (max-width:520px){.quota{grid-template-columns:minmax(0,1fr)}}
.phases{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.ph{border-top:2px solid var(--seam-2);padding-top:10px}
.ph.now{border-top-color:var(--amber)} .ph.done{border-top-color:var(--ok)}
.ph .d{font:500 11.5px var(--f-mono);color:var(--tx-3)}
@media (max-width:760px){.phases{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---------- пирамида ---------- */
.pyr svg{width:100%;height:auto;display:block;max-width:100%}
.pyr .blk{cursor:pointer}
.pyr .blk rect.base{fill:var(--pn-2);stroke:var(--seam-2);stroke-width:1.2}
.pyr .blk.wip rect.base{stroke:var(--amber-2)}
.pyr .blk.pub rect.base{fill:var(--amber);stroke:var(--amber)}
.pyr .blk:hover rect.base,.pyr .blk:focus rect.base{stroke:var(--tx)}
.pyr .blk.sel rect.base{stroke:var(--laser);stroke-width:2.4}
.pyr .blk:focus{outline:none}
.pyr .blk text{fill:var(--tx);pointer-events:none}
.pyr .blk.pub text{fill:var(--amber-ink)}
.pyr .blk text.c{font:500 11px var(--f-mono);letter-spacing:.08em;fill:var(--tx-3)}
.pyr .blk.pub text.c{fill:rgba(23,16,10,.7)}
.pyr .blk text.t{font:600 13px var(--f-body)}
.pyr .blk rect.fill{fill:var(--amber-soft)}
.pyr .lsr{stroke:var(--laser);stroke-width:1.2;filter:drop-shadow(0 0 3px var(--laser))}
.tiers{display:flex;flex-direction:column;gap:0}
.tier{display:grid;grid-template-columns:54px minmax(0,1fr);gap:12px;padding:14px 0;border-bottom:1px solid var(--seam)}
.tier:last-child{border-bottom:0}
.tier .rn{font:400 30px/1 var(--f-display);color:var(--amber)}
.brief{display:flex;flex-direction:column;gap:14px}
.brief h2{font:400 clamp(26px,3.4vw,38px)/1.05 var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.hookset{display:flex;flex-direction:column;gap:4px;border-left:2px solid var(--laser);padding-left:12px}
.hookset .de{font:400 22px/1.2 var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.pyr-grid{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
@media (max-width:900px){.pyr-grid{grid-template-columns:minmax(0,1fr)}}

/* ---------- производство ---------- */
.vidpick{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.vp{flex:0 0 auto;display:flex;flex-direction:column;gap:3px;min-width:116px;text-align:left;font:inherit;color:var(--tx-2);background:var(--pn);border:1px solid var(--seam);border-radius:2px;padding:8px 10px;cursor:pointer}
.vp b{font:600 13px/1.25 var(--f-body);color:var(--tx)}
.vp span{font:500 10.5px var(--f-mono);letter-spacing:.06em;color:var(--tx-3)}
.vp[aria-pressed="true"]{border-color:var(--amber);background:var(--pn-2);box-shadow:inset 0 -2px 0 var(--amber)}
.vp.pub b::after{content:" ●";color:var(--amber);font-size:10px}
.stages{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--seam);background:var(--pn)}
.stg{position:relative;display:flex;flex-direction:column;gap:3px;padding:12px 12px 14px;border:0;border-right:1px solid var(--seam);background:transparent;color:var(--tx-3);font:inherit;text-align:left;cursor:pointer;min-width:0}
.stg:last-child{border-right:0}
.stg i{font:500 10.5px var(--f-mono);letter-spacing:.1em;font-style:normal}
.stg b{font:600 13.5px/1.2 var(--f-body);color:var(--tx-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stg::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:transparent}
.stg.done::after{background:var(--ok)} .stg.done i{color:var(--ok)}
.stg.cur{background:var(--pn-2)} .stg.cur::after{background:var(--amber)} .stg.cur b{color:var(--tx)} .stg.cur i{color:var(--amber)}
@media (max-width:860px){.stages{grid-template-columns:repeat(7,minmax(92px,1fr));overflow-x:auto}}
.stage-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--seam);padding-top:16px}
.shots{width:100%;border-collapse:collapse;font-size:13.5px}
.shots th{font:500 10px/1.2 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--tx-3);text-align:left;padding:9px 8px;border-bottom:1px solid var(--seam);white-space:nowrap}
.shots td{padding:9px 8px;border-bottom:1px solid var(--seam);vertical-align:top}
.shots select,.shots input{font-size:13px;padding:7px 26px 7px 8px}
.shots input[type=text],.shots input[type=number]{padding:7px 8px}
.shots .sn{font:700 13px var(--f-mono);color:var(--amber);white-space:nowrap}
.shots td.desc{min-width:200px;width:30%}
.tstk{display:flex;flex-direction:column;gap:5px;min-width:160px}
.tstk label{display:grid;grid-template-columns:52px minmax(0,1fr);align-items:center;gap:6px;font:500 9.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--tx-3)}
.shot-detail td{background:var(--bg-2)}

const ABC = [
  {id:"a-what",t:"Что мы делаем — на одной схеме",min:5,widget:"pipeline",text:["Мы делаем 10 коротких вертикальных роликов для TikTok. Каждый — 15–30 секунд.","Ролик — это 3–6 коротких **клипов** по 3–8 секунд, склеенных подряд. Как стена из плитки: ролик — стена, клип — одна плитка.","Каждый клип нейросети делают в два хода: сначала **картинка** (первый кадр), потом из неё **видео со звуком**. Потом добавляем звук, надписи, склеиваем в CapCut и публикуем.","Камеры, актёров и съёмочной площадки нет. Нужны компьютер, браузер и умение дать нейросети точное задание — этому и учит маршрут."],q:["Из чего состоит один ролик?","Из 3–6 клипов по 3–8 секунд, склеенных в CapCut. Каждый клип = картинка → видео."]},
  {id:"a-image",t:"Нейросеть-художник: как из текста получается картинка",min:5,text:["Ты знаешь ChatGPT: пишешь текст — он отвечает текстом. Нейросеть-художник (у нас это **Nano Banana** внутри Gemini) работает так же, только отвечает **картинкой**.","Она училась на сотнях миллионов фотографий с подписями. Поэтому понимает не только «плитка», но и «синий час», «объектив 85 мм», «малая глубина резкости» — слова фотографов.","Каждый раз результат новый, как бросок кубика. Поэтому правило: делаем 3–4 варианта и выбираем лучший. Плохой вариант — не твоя ошибка, а нормальный брак.","Чем точнее задание, тем меньше брака. Как с бригадой: «положи плитку» — получишь что угодно; «крупный формат 60×120, шов 2 мм, от лазерной линии» — получишь то, что нужно."],q:["Почему делаем несколько вариантов одной картинки?","Каждая генерация — новый бросок кубика. Из 3–4 выбираем лучший, остальное — нормальный брак."]},
  {id:"a-prompt",t:"Промпт — это техзадание",min:5,text:["**Промпт** — текст-задание для нейросети. Это слово ты будешь видеть везде.","Наш промпт всегда собран из одних и тех же частей: **что** в кадре, **план** (крупно, общий, сверху), **свет**, **объектив**, **движение камеры** и **правила бренда** (цвет, без лиц, без надписей).","Писать промпты тебе не нужно. Ты выбираешь значения в выпадающих списках — штаб сам собирает текст. Хочешь по-другому — скажи Наставнику по-русски.","Промпты по умолчанию на английском: нейросети больше всего учились на английских подписях и понимают их точнее. Под каждым промптом есть перевод на русский — ты всегда знаешь, что отдаёшь. Во «Вселенной» можно переключить промпты на русский целиком."],q:["Нужно ли тебе самому писать промпты?","Нет. Штаб собирает их из полей, а правки ты просишь у Наставника обычными словами."]},
  {id:"a-key",t:"Ключевой кадр: почему сначала картинка",min:4,text:["Видео-нейросеть может сделать клип и просто по тексту. Но тогда она каждый раз придумывает кадр заново — и вид гуляет от клипа к клипу.","Поэтому сначала делаем **ключевой кадр** — картинку, которая станет первым кадром клипа. Видео-нейросеть берёт её и только добавляет движение.","Как раскладка насухо: сначала смотришь, как ляжет плитка, и только потом клеишь. Кривой ключевой кадр — кривой клип, поэтому кадр проверяем строго."],q:["Что такое ключевой кадр?","Картинка, которая станет первым кадром клипа. Видео-нейросеть её оживляет."]},
  {id:"a-video",t:"Veo: как картинка начинает двигаться",min:5,text:["**Veo 3.1** — видео-нейросеть Google. Делает клип до 8 секунд **сразу со звуком**. Работаем с ней на сайте **Flow**.","Два режима: **Text to Video** («текст в видео») — клип только по тексту; **Frames to Video** («кадры в видео») — клип из твоей картинки плюс текст о движении. Мы почти всегда используем второй.","Два качества: **Fast** — быстро и дёшево, для черновиков; **Quality** — дольше и дороже, для финала.","Брак — норма: из 2–3 клипов годится один. Плитка «поплыла», появилось лицо, лишние пальцы — в мусор, без жалости."],q:["Какой режим Flow мы используем почти всегда?","Frames to Video: картинка (ключевой кадр) + текст о движении."]},
  {id:"a-credits",t:"Кредиты и лимиты: за что платим",min:4,text:["Подписка — это пачка «жетонов» (**кредитов**). Каждая картинка или клип тратит жетоны. Fast тратит меньше, Quality — больше.","В Gemini есть дневной лимит видео — около 3 в день. Он **не копится**: не сделал сегодня — завтра всё равно будет 3, а не 6.","Поэтому правило проекта: генерировать понемногу каждый день и отмечать в штабе (+1 на вкладке «Штаб»).","Подписки помесячные. В «Арсенале» штаб ставит дату «отменить до», чтобы не платить лишний месяц."],q:["Почему важно генерировать каждый день?","Дневной лимит не копится: пропущенный день — потерянные клипы."]},
  {id:"a-sound",t:"Звук и голос",min:4,text:["Veo делает звук сам. Иногда он идеален, иногда нет.","**ElevenLabs** умеет три вещи. **Sound Effects** — звук по описанию («удар бетона», «щелчок клипсы»). **Text to Speech** — читает твой текст голосом. **Voice Isolator** — чистит запись с телефона до студийного звука.","В наших роликах нет музыки. Звук = гул на фоне + звуки материалов + звуковой логотип в конце. Это дешевле музыки и сразу узнаётся.","Голос — русский. В роликах про людей (V08–V09) — живой голос бати или твой, в финальном фильме V10 — ИИ-диктор."],q:["Что делает Voice Isolator?","Очищает живую запись голоса от шума — до студийного звука."]},
  {id:"a-edit",t:"Монтаж: как устроен CapCut",min:6,text:["CapCut — программа, где клипы склеиваются в ролик. В ней четыре зоны.","**Медиатека** (слева вверху) — склад: сюда загружаешь все файлы ролика.","**Окно просмотра** (в центре вверху) — витрина: смотришь, что получается.","**Шкала времени** (внизу) — стена: клипы кладёшь слева направо, по порядку. Время идёт слева направо.","**Дорожки** — слои на шкале. Основная дорожка — клипы; над ней — титры (надписи); под ней — звук. Что выше, то поверх.","**9:16** — вертикальный формат телефона. **1080×1920** — размер кадра в точках. **30 fps** — 30 кадров в секунду. **Экспорт** — сохранить готовый ролик одним файлом MP4."],q:["Где в CapCut клипы лежат по порядку?","На шкале времени внизу, слева направо. Титры — на дорожке выше, звук — ниже."]},
  {id:"a-tiktok",t:"TikTok: как ролик находит людей",min:4,text:["TikTok сначала показывает ролик небольшой группе. Если досматривают, пересматривают и пересылают — показывает следующим, всё шире.","Поэтому **первые 2 секунды** решают всё: это **хук** — то, что останавливает палец.","**Досмотр** — какую часть ролика в среднем смотрят. **Удержание** — график: на какой секунде уходят.","У каждого ролика ставим метку **«Создано ИИ»**: это честно и требование площадки."],q:["Что такое хук?","Первые 1–2 секунды ролика, которые должны остановить палец зрителя."]},
  {id:"a-words",t:"Словарь штаба",min:5,widget:"glossary",text:["Все непонятные слова — здесь. Начни печатать слово в поиске. Не нашёл — спроси Наставника."]}

  motion:["Вкладка **04 Движение**. Здесь картинка становится видео со звуком.","У кадра S1 нажми **Копировать** (промпт видео).","Нажми **Открыть Veo 3.1 · Flow** и войди аккаунтом фирмы.","Открой проект **MC Monolith** на главной Flow или нажми **Новый проект**.","Внизу экрана строка ввода. Рядом с ней переключатель режима — выбери **Frames to Video** («Кадры в видео»).","Нажми **+** у поля первого кадра → «Загрузить» → выбери **kf/s1.png** из папки ролика.","Кликни в строку и вставь промпт [[MOD+V]].","Открой настройки (значок шестерёнки или ползунков): модель **Veo 3.1 – Fast**, формат **9:16**, вариантов **2**.","Нажми стрелку **➤**. Ждать 1–3 минуты — можно пока запускать следующий кадр.","Посмотри оба варианта. Лучший — **↓ Скачать** (если предлагает качество — 1080p).","Переименуй в **s1_v1.mp4** и перенеси в папку ролика → **clips**.","В штабе: **Клип готов ✓** и **+1 к лимиту дня**. Лимит кончился — продолжишь завтра.","Кадры «Text→Video»: режим **Text to Video**, картинку не загружаешь.","Все клипы готовы — **Этап выполнен · далее**."],
  sound:["Вкладка **05 Звук и голос**. Сначала послушай клипы: Veo уже сделал звук. Подходит — оставляешь.","Звуки бренда (гул, звуковой логотип) ты сделал в модуле 2 — они в папках 00_brand и 00_sfx.","Нужен новый звук: ElevenLabs → **Sound Effects** → вставь описание по-английски (готовые — во «Вселенной» → «Звук») → **Generate** → ▶ послушай → **↓** скачай → в папку ролика → **audio**.","Голос нужен только в V08–V10. Живой голос: запись на телефон → Voice Isolator → скачать в **audio**. ИИ-голос: ElevenLabs → **Text to Speech** → вставь русский текст → **Generate** → скачать в **audio**.","Отметь галочки чек-листа и нажми **Этап выполнен · далее**."],
  edit:["Вкладка **06 Монтаж**. Сначала скачай титр и финальную карточку кнопками внизу этапа и перенеси в папку ролика → **titles**.","Открой CapCut → **Создать проект**.","Нажми **Импорт** и выбери файлы ролика: всё из **clips**, **titles**, **audio** и звуки из **00_brand** и **00_sfx**. Они появятся слева в медиатеке.","Над окном просмотра нажми **Соотношение** (Ratio) → **9:16**.","Перетащи клипы s1, s2, s3… мышкой на шкалу времени внизу — по порядку, вплотную.","Подрезать край клипа: выдели клип и потяни его край. Разрезать: поставь бегунок в нужное место, нажми [[MOD+B]], лишний кусок выдели и нажми [[Delete]].","Цвет: выдели клип → справа вкладка **Настройка** (Adjust) → выставь значения «MC Basalt» из «Вселенной» → «Цвет» или примени сохранённый пресет. Так для каждого клипа.","Титр: перетащи **titr.png** на дорожку **над** клипами, в самое начало, и потяни его правый край до 2,5 секунды.","Финальная карточка: **endcard.png** — в конец основной дорожки, длина 1,5 секунды.","Звук: **drone.mp3** — на дорожку под всеми клипами; **sonic_logo.mp3** — под финальной карточкой. Выдели гул → справа **Громкость** → около −15 дБ, чтобы он стал фоном.","Нажми [[Space]] и посмотри ролик целиком. Первые полсекунды — уже движение? Конец стыкуется с началом?","Справа вверху **Экспорт**: 1080p, 30 кадров/с, MP4, папка ролика, имя **final** → **Экспорт**.","Просит Pro при экспорте — где-то стоит платный эффект (значок короны). Найди его и удали.","Готово — **Этап выполнен · далее**."],
  air:["Вкладка **07 Эфир**. Нажми **Копировать** у блока «Подпись к ролику».","Нажми **Загрузить в TikTok Studio** (аккаунт фирмы).","Перетащи файл **final.mp4** в окно загрузки или нажми «Выбрать файл».","Поле «Описание»: кликни и вставь подпись [[MOD+V]].","**Обложка** → «Изменить» → выбери самый сильный кадр.","Открой **Показать больше** (дополнительные настройки) → включи **Контент, созданный ИИ**.","Там же включи **Раскрытие контента** → **Ваш бренд**: ролик рекламирует фирму, и TikTok честно пометит его как рекламный. Одна галочка, документы не нужны.","**Когда опубликовать** → **Запланировать** → дата из штаба, время **19:30** → **Запланировать**.","В день выхода нажми в штабе **Отметить: вышел в эфир**."],
  check:["Через 48 часов после выхода открой **TikTok Studio** → **Аналитика** (или «Публикации») → нажми на ролик.","Перепиши в штаб, вкладка **07 Эфир**, блок «Цифры»: просмотры, средний досмотр, лайки, комментарии, репосты, сохранения, подписки.","Найди график удержания: на какой секунде линия резко падает — там зритель ушёл.","Запиши вывод в «Эфир» → «Ретро». Не понимаешь цифры — спроси Наставника: «что значат мои цифры у V01?»"]
};

  {id:"r0-chrome",t:"Chrome и профиль фирмы",min:10,why:"Все нейросети работают в браузере. Отдельный профиль фирмы держит входы, пароли и подписки в одном месте и не смешивает их с твоими личными.",

   do:["«Вселенная» → блок **Знак · закреплён**.","Нажми по очереди: «Оригинал SVG», «PNG прозрачный», «PNG на плашке», «Аватар». Каждый раз подтверждай сохранение.","Открой «Загрузки» и перенеси все 4 файла в **MC_MONOLITH/00_brand** (как в шаге 0.7).","TikTok Studio → профиль → **Изменить профиль** → фото → выбери **mc-avatar.png**."],result:"В 00_brand четыре файла знака, на аватаре TikTok — mc²."},
  {id:"r2-sfx",t:"Звуки бренда",min:20,go:"universe",why:"Свой звук в каждом ролике — как подпись. Делаешь один раз, используешь всегда.",
   do:["Нажми **ElevenLabs Sound Effects** ниже.","В штабе «Вселенная» → блок **Звук · ДНК** → у «Звуковой логотип» нажми **Копировать**.","Вставь текст в поле ElevenLabs [[MOD+V]] и нажми **Generate**.","Послушай варианты ▶. Лучший — значок **↓**.","Переименуй в **sonic_logo.mp3** и перенеси в **00_brand**.","Так же сделай остальные: гул → **drone.mp3** (в 00_brand), лазер → laser.mp3, шпатель → trowel.mp3, клипсы → clips.mp3, резка → saw.mp3, рассвет → dawn.mp3 (в 00_sfx)."],result:"В 00_brand — sonic_logo.mp3 и drone.mp3, в 00_sfx — остальные звуки.",links:[["ElevenLabs Sound Effects","https://elevenlabs.io/app/sound-effects"]]},
  TOURS.gemini,
  {id:"r2-img",t:"Тест: первый кадр в Gemini",min:20,go:"universe",why:"Почувствовать, как текст превращается в картинку и как свет меняет настроение. Это главный навык проекта.",
   do:["«Вселенная» → **Конструктор промптов**. Выбери: План — Макро, Свет — Синий час, Оптика — Макро 100 мм. Нажми **Копировать** у «Ключевой кадр».","Нажми **Gemini** ниже → **Новый чат**.","Если у строки ввода есть кнопка инструментов — выбери «Изображение». Нет — просто вставляй промпт.","Вставь промпт [[MOD+V]] и нажми [[Enter]]. Жди 10–40 секунд.","Сделай ещё 2 картинки: поменяй «Свет» в конструкторе (золотой час, ночь), скопируй, вставь в тот же чат.","Скачай лучшие (наведи → **↓**) и перенеси в **00_tests**.","Не понимаешь, что написано в промпте — нажми под ним **Что это значит?**"],result:"В 00_tests три картинки с разным светом. Ты видишь, какой свет выглядит дороже.",links:[["Gemini","https://gemini.google.com/app"]]},
  TOURS.flow,
  {id:"r2-clip",t:"Тест: первый клип во Flow",min:20,why:"Увидеть, как ИИ оживляет твою картинку и сам делает звук.",
   do:["Нажми **Flow** ниже, войди аккаунтом фирмы.","**Новый проект** → назови «MC Monolith».","Внизу у строки ввода выбери режим **Frames to Video** («Кадры в видео»).","Нажми **+** у поля первого кадра → загрузи лучшую картинку из 00_tests.","Штаб → «Вселенная» → «Конструктор» → **Копировать** у «Видео». Вставь в строку Flow [[MOD+V]].","Открой настройки (шестерёнка или ползунки): модель **Veo 3.1 – Fast**, формат **9:16**, вариантов **2**.","Нажми **➤**. Через 1–3 минуты появятся 2 клипа. Посмотри оба со звуком.","Лучший — **↓** скачать → перенеси в **00_tests**.","В штабе на вкладке «Штаб» нажми **+1** у Veo."],result:"У тебя первый клип со звуком, сделанный из твоей картинки.",trouble:["Нет режима Frames to Video → ищи «Image to Video» или значок картинки у строки ввода.","Нет формата 9:16 → проверь, что выбрана модель Veo 3.1.","«Недостаточно кредитов» → Gemini → Новый чат → инструмент «Видео» → вставь промпт (около 3 видео в день)."],links:[["Flow","https://labs.google/fx/tools/flow"]]},

  {id:"r2-grade",t:"Цвет «MC Basalt» в CapCut",min:15,why:"Один цвет на всех клипах склеивает разные нейросети в один фильм.",
   do:["Открой CapCut → **Создать проект**.","**Импорт** → тестовый клип из 00_tests → перетащи его на шкалу времени внизу.","Выдели клип. Справа открой вкладку **Настройка** (Adjust).","Выставь значения из «Вселенной» → «Цвет»: контраст +10, насыщенность −15 и дальше по таблице.","Сравни «до» и «после» переключателем у настройки.","Внизу панели нажми **Сохранить как пресет** и назови «MC Basalt». Нет такой кнопки — не страшно, значения всегда есть в штабе."],result:"Тестовый клип выглядит темнее и благороднее, пресет сохранён или значения записаны.",go:"universe"},
  {id:"r2-voice",t:"Голос бренда",min:20,why:"В роликах про людей (V08–V09) живой голос даёт доверие, которого ИИ-видео не хватает.",
   do:["Телефон: iPhone — приложение **Диктофон**, Android — **Диктофон** или **Recorder**.","Тихая комната, телефон в 20 см ото рта. Батя (или ты) читает строку V08 по-русски, 3 дубля. Тексты — в «Производстве» → V08 → этап «Звук и голос».","Перешли запись на компьютер: iPhone и Mac — AirDrop; любой телефон — Telegram → «Избранное» → открой Telegram на компьютере и скачай файл.","Нажми **Voice Isolator** ниже → загрузи файл → скачай очищенный → в **V08…/audio**.","Сравни с ИИ-голосом: **Text to Speech** → вставь ту же строку → Generate. Решите с батей, чей голос звучит в V08–V09."],result:"Есть чистая запись живого голоса, решено, чей голос в ярусе «Братство».",links:[["Voice Isolator","https://elevenlabs.io/app/voice-isolator"],["Text to Speech","https://elevenlabs.io/app/speech-synthesis/text-to-speech"]]}
 ]},

const ACADEMY_MOD = {id:"m6",n:"6",t:"Прокачка",d:"Упражнения, после которых кадры становятся дорогими. Можно проходить параллельно с роликами.",steps:ACADEMY.flatMap(L=>L.ls.map(x=>({id:x.id,t:L.n+" · "+x.t,min:20,why:L.d,do:x.do,result:x.pass,links:x.links})))};
ROUTE.push(ACADEMY_MOD);
function osv(x){ return (x && typeof x==="object" && !Array.isArray(x)) ? (x[S.state.os]||x.mac) : x; }
function keyName(k){ return k.replace(/MOD/g, S.state.os==="mac"?"Cmd":"Ctrl"); }
function fmt(t){ return esc(t).replace(/\[\[([^\]]+)\]\]/g,(m,k)=>`<kbd>${keyName(k)}</kbd>`).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>"); }
function plain(t){ return String(t||"").replace(/\[\[([^\]]+)\]\]/g,(m,k)=>keyName(k)).replace(/\*\*([^*]+)\*\*/g,"$1"); }
function v01(){ return S.videos.find(v=>Number(v.num)===1); }
let _flat = null;
function flatRoute(){ if (_flat) return _flat; _flat = []; for (const m of ROUTE) m.steps.forEach((st,i)=>_flat.push(Object.assign({},st,{mod:m,num:m.n+"."+(i+1)}))); return _flat; }
function stepDo(st){ if (st.stage) return CLICK[st.stage]; if (st.clicks) return CLICK[st.clicks]; return (osv(st.do)||[]).map(osv); }
function routeDone(st){ if (st.stage){ const v = v01(); return !!(v && v.stages && v.stages[st.stage]); } return !!S.state.route[st.id]; }
function routeCur(){ const f = flatRoute(); return f.find(s=>s.id===S.routeAt) || f.find(s=>s.id===S.state.routeAt) || f.find(s=>!routeDone(s)) || f[f.length-1]; }
const TRANS = {а:"a",б:"b",в:"v",г:"g",д:"d",е:"e",ё:"e",ж:"zh",з:"z",и:"i",й:"y",к:"k",л:"l",м:"m",н:"n",о:"o",п:"p",р:"r",с:"s",т:"t",у:"u",ф:"f",х:"h",ц:"ts",ч:"ch",ш:"sh",щ:"sch",ъ:"",ы:"y",ь:"",э:"e",ю:"yu",я:"ya"};
function slug(t){ return String(t||"").toLowerCase().split("").map(c=>TRANS[c]!=null?TRANS[c]:c).join("").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,24)||"video"; }
function folderList(){ const vids = S.videos.length ? [...S.videos].sort(byNum) : DEFAULT_V; return vids.map(v=>"V"+pad2(v.num)+"_"+slug(v.title)); }
function treeCmd(os){
  const list = folderList();
  if (os==="win") return `$b = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'MC_MONOLITH'; foreach ($d in '00_brand','00_sfx','00_tests') { New-Item -ItemType Directory -Force -Path (Join-Path $b $d) | Out-Null }; foreach ($v in '_TEMPLATE',${list.map(x=>"'"+x+"'").join(",")}) { foreach ($s in 'kf','clips','audio','titles') { New-Item -ItemType Directory -Force -Path (Join-Path (Join-Path $b $v) $s) | Out-Null } }; explorer $b`;
  return `mkdir -p ~/Documents/MC_MONOLITH/{00_brand,00_sfx,00_tests} && for d in _TEMPLATE ${list.join(" ")}; do mkdir -p ~/Documents/MC_MONOLITH/$d/{kf,clips,audio,titles}; done && open ~/Documents/MC_MONOLITH`;
}
function vFolder(v){ return "V"+pad2(v.num)+"_"+slug(v.title); }

function newQuiz(){ const o = [0,1,2,3,4,5,6,7]; for (let i=o.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [o[i],o[j]]=[o[j],o[i]]; } return {order:o, ok:[], miss:0, wins:(S.quiz&&S.quiz.wins)||0}; }

/* ---- методичка ---- */
function buildMd(){
  const os = S.state.os==="win" ? "Windows" : "Mac", L = [];
  L.push("# Методичка Monolith — видео с нейросетями с нуля", "", `Система: ${os}. Проект: MC Infrastructure. Собрано штабом ${fmtD(today())}.2026.`, "");
  L.push("## Формула: видео строится как объект", "");
  FORMULA.forEach((f,i)=>L.push(`${i+1}. **${f.m}** — ${f.s}. ${f.d}`));
  L.push("", "## Пять законов вселенной", ""); LAWS.forEach(([t,d],i)=>L.push(`${i+1}. **${t}.** ${d}`));
  L.push("", "## Промо-пирамида 4 · 3 · 2 · 1", ""); TIERS.forEach(t=>L.push(`- **Ярус ${t.code} · ${t.name}** — ${t.goal} Метрика: ${t.kpi}.`));
  for (const m of ROUTE){
    L.push("", `## Модуль ${m.n} · ${m.t}`, "", m.d);
    m.steps.forEach((st,i)=>{
      L.push("", `### ${m.n}.${i+1} ${st.t}`);
      if (st.why) L.push("", `Зачем: ${plain(st.why)}`);
      if (st.text) { L.push(""); st.text.forEach(p=>L.push(plain(p), "")); }
      const d = stepDo(st); if (d && d.length){ L.push(""); d.forEach((x,k)=>L.push(`${k+1}. ${plain(x)}`)); }
      if (st.widget==="tree") L.push("", "```", treeCmd(S.state.os), "```");
      if (st.result) L.push("", `Должно получиться: ${plain(st.result)}`);
      if (st.trouble) { L.push("", "Если не получилось:"); st.trouble.forEach(x=>L.push(`- ${plain(x)}`)); }
      if (st.q) L.push("", `Проверь себя: ${st.q[0]} — ${st.q[1]}`);
      if (st.links) L.push("", "Ссылки: "+st.links.map(([l,u])=>`[${l}](${u})`).join(", "));
    });
  }
  L.push("", "## Строительные блоки промпта (ДНК)", ""); Object.keys(DNA).forEach(k=>L.push(`- **${DNA_NAMES[k]}**: ${dna(k,"en")}  \n  по-русски: ${dna(k,"ru")}`));
  L.push("", "## Словарь", ""); GLOSSARY.forEach(([w,d])=>L.push(`- **${w}** — ${d}`));
  L.push("", "## Если застрял", "", "1. Скриншот → Наставник в штабе.", "2. Если штаб недоступен — открой Claude и напиши: «Я делаю видео по методичке Monolith, шаг такой-то, не получается вот что» и приложи скриншот.");
  return L.join("\n");
}

function shotPatch(p){
  const o = {}, chk = (v,list,name) => { const k = String(v); if (!list.some(x=>x[0]===k)) throw new Error(name+": допустимо "+list.map(x=>x[0]).join(", ")); return k; };
  if (!p || typeof p!=="object") throw new Error("Нет изменений");
  for (const k of ["desc","subject","subjectRu","audio","audioRu"]) if (p[k]!=null) o[k] = String(p[k]);
  if (p.type!=null) o.type = chk(p.type,TYPES,"type");
  if (p.light!=null) o.light = chk(p.light,LIGHTS,"light");
  if (p.lens!=null) o.lens = chk(p.lens,LENSES,"lens");
  if (p.move!=null) o.move = chk(p.move,MOVES,"move");
  if (p.kfTool!=null) o.kfTool = chk(p.kfTool,KF_TOOLS,"kfTool");
  if (p.vidTool!=null) o.vidTool = chk(p.vidTool,VID_TOOLS,"vidTool");
  if (p.laser!=null) o.laser = !!p.laser;
  if (p.dur!=null) o.dur = Math.max(2,Math.min(8,Number(p.dur)||5));
  return o;
}

function curStage(v){ return S.stageOf[v.id] || (STAGES.find(s=>!(v.stages||{})[s.id])||STAGES[STAGES.length-1]).id; }
function rProd(){
  pickDefaultVid();
  const v = S.vid ? vById(S.vid) : null;
  if (!v) return `${sh("04 · Производство","Конвейер","","4")}${emptyVideos()}`;
  const pick = `<div class="vidpick" role="group" aria-label="Ролики">${[...S.videos].sort(byNum).map(x=>`<button class="vp${isPub(x)?" pub":""}" data-act="pick-vid" data-id="${esc(x.id)}" aria-pressed="${x.id===S.vid}"><span>${vcode(x)} · ЯРУС ${roman(x.tier)} · ${stagesDone(x)}/7</span><b>${esc(x.title)}</b></button>`).join("")}</div>`;
  const cs = curStage(v), idx = STAGES.findIndex(s=>s.id===cs);
  const rail = `<div class="stages" role="tablist" aria-label="Этапы">${STAGES.map((s,i)=>`<button role="tab" class="stg${(v.stages||{})[s.id]?" done":""}${s.id===cs?" cur":""}" data-act="stage" data-s="${s.id}" aria-selected="${s.id===cs}"><i>${pad2(i+1)}${(v.stages||{})[s.id]?" ✓":""}</i><b>${s.n}</b></button>`).join("")}</div>`;
  const body = {brief:stBrief,board:stBoard,frames:stFrames,motion:stMotion,sound:stSound,edit:stEdit,air:stAir}[cs](v);
  const done = !!(v.stages||{})[cs];
  return `${sh("04 · Производство", esc(vcode(v)+" · "+v.title), "Семь этапов от брифа до эфира. Этап закрывается кнопкой внизу — штаб сам ведёт к следующему.","4")}
  ${pick}${rail}
  <section class="pn stack" style="gap:18px">${body}
    <div class="stage-foot"><button class="btn ghost" data-act="stage-prev"${idx===0?" disabled":""}>← Назад</button>
      <div class="row"><span class="xs mut mono">${pad2(idx+1)}/07 · ${esc(STAGES[idx].n)}</span>
      <button class="btn${done?"":" pri"}" data-act="stage-done">${done?"Этап закрыт ✓ · снять отметку":(idx===STAGES.length-1?"Закрыть ролик":"Этап выполнен · далее →")}</button>${done&&idx<STAGES.length-1?`<button class="btn pri" data-act="stage-next">Далее →</button>`:""}</div></div>
  </section>`;
}
function vf(v,f,label,cls,type,ph){

}
function stBrief(v){

function shotCards(v, kind){

  return list.map(({s,i})=>{ const ok = kind==="kf" ? ["kf","clip","done"].includes(s.status) : ["clip","done"].includes(s.status);
    const tool = kind==="kf"?s.kfTool:s.vidTool, link = TOOL_LINK[tool], name = lbl(kind==="kf"?KF_TOOLS:VID_TOOLS, tool);
    return `<div class="scard${ok?" done":""}"><div class="sn">S${i+1}</div><div class="stack" style="min-width:0">
      <div class="row between"><div style="min-width:0"><div class="h3">${esc(s.desc||"")}</div>${s.subjectRu?`<div class="sm t2">${esc(s.subjectRu)}</div>`:""}<div class="xs mut mono">${esc(lbl(TYPES,s.type))} · ${esc(lbl(LIGHTS,s.light))} · ${esc(lbl(LENSES,s.lens))} · ${esc(s.dur||5)} с${kind==="clip"&&s.kfTool==="none"?" · Text→Video":""}</div></div><span class="chip ${ok?"o":"line"}">${ok?(kind==="kf"?"кадр готов":"клип готов"):"в работе"}</span></div>
      ${promptBox(kind==="kf"?"Промпт кадра":"Промпт видео", kind==="kf"?kfPrompt(s):vidPrompt(s), `${kind}-c-${v.id}-${s.id}`, false, kind==="kf"?kfPrompt(s,"ru"):vidPrompt(s,"ru"))}

function rAI(v,ai){

  if (ai.err) return `<div class="ai row between"><p class="sm">${esc(ai.err)}</p><button class="btn s ghost" data-act="ai-close" data-id="${esc(v.id)}">Закрыть</button></div>`;
  const r = ai.result||{}, hk = r.hooks||{};
  let h = `<div class="ai stack"><div class="row between"><b>Предложение Claude</b><button class="btn s ghost" data-act="ai-close" data-id="${esc(v.id)}">Закрыть</button></div>`;

  if (Array.isArray(r.shots)&&r.shots.length) h += `<ol class="sm" style="margin:0;padding-left:20px">${r.shots.map(s=>`<li><b>${esc(s.desc||"")}</b> <span class="mut">· ${esc(lbl(TYPES,s.type))} · ${esc(lbl(LIGHTS,s.light))} · ${esc(s.dur||5)} с</span></li>`).join("")}</ol><div class="row"><button class="btn pri s" data-act="ai-apply" data-id="${esc(v.id)}">${(v.shots||[]).length?"Заменить кадры":"Взять кадры"}</button></div>`;
  return h+"</div>";
}

/* ===================== ХОЛСТ: ТИТРЫ И КАРТОЧКА ===================== */
function wrapText(ctx,text,maxW){
  const words = String(text||"").split(/\s+/).filter(Boolean), lines = []; let line = "";
  for (const w of words){ const t = line?line+" "+w:w; if (ctx.measureText(t).width>maxW && line){ lines.push(line); line = w; } else line = t; }
  if (line) lines.push(line); return lines;
}
function lsp(ctx,v){ if ("letterSpacing" in ctx) ctx.letterSpacing = v; }
async function fontsReady(){ try { await Promise.all(["400 90px Forum","500 44px Onest","500 30px 'JetBrains Mono'"].map(f=>document.fonts.load(f))); } catch(e){} }
function line2(v){ const l = S.state.brand.lang2; return l==="de" ? (v.hookDe||"") : (l==="ro" ? (v.hookRo||"") : ""); }
function drawHook(cv,v){
  const ctx = cv.getContext("2d"), W = 1080; ctx.clearRect(0,0,W,1920);
  ctx.save(); ctx.shadowColor = "rgba(0,0,0,.6)"; ctx.shadowBlur = 28; ctx.textAlign = "center";
  ctx.fillStyle = "rgba(236,229,216,.78)"; ctx.font = "500 28px 'JetBrains Mono', monospace"; lsp(ctx,"8px");
  ctx.fillText(`MC INFRASTRUCTURE · ${pad2(v.num)}/10`, W/2, 250);
  ctx.fillStyle = "#ECE5D8"; ctx.font = "400 92px Forum, 'Times New Roman', serif"; lsp(ctx,"6px");
  let y = 370;
  for (const l of wrapText(ctx, String(v.hookRu||v.hookDe||"").toUpperCase(), 940)){ ctx.fillText(l, W/2, y); y += 104; }
  ctx.restore();
  ctx.save(); ctx.strokeStyle = "#FF5A3C"; ctx.lineWidth = 4; ctx.shadowColor = "#FF5A3C"; ctx.shadowBlur = 18;
  ctx.beginPath(); ctx.moveTo(W/2-170, y-36); ctx.lineTo(W/2+170, y-36); ctx.stroke(); ctx.restore();
  ctx.save(); ctx.shadowColor = "rgba(0,0,0,.6)"; ctx.shadowBlur = 22; ctx.textAlign = "center"; ctx.fillStyle = "rgba(236,229,216,.92)"; ctx.font = "500 44px Onest, system-ui, sans-serif"; lsp(ctx,"0px");
  y += 40;
  for (const t of [line2(v)].filter(Boolean)){ for (const l of wrapText(ctx,t,900)){ ctx.fillText(l, W/2, y); y += 58; } y += 8; }
  ctx.restore();
}
async function drawEnd(cv,v){

  const ctx = cv.getContext("2d"), W = 1080, H = 1920, b = S.state.brand, cl = claim();
  const g = ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,"#121518"); g.addColorStop(1,"#0B0D0F"); ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  const rg = ctx.createRadialGradient(W/2,760,40,W/2,760,720); rg.addColorStop(0,"rgba(232,130,30,.12)"); rg.addColorStop(1,"rgba(232,130,30,0)"); ctx.fillStyle = rg; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.strokeStyle = "#FF5A3C"; ctx.lineWidth = 6; ctx.shadowColor = "#FF5A3C"; ctx.shadowBlur = 24; ctx.beginPath(); ctx.moveTo(80, 760); ctx.lineTo(W-80, 760); ctx.stroke(); ctx.restore();
  const pw = 600, ph = 400, px = (W-pw)/2, py = 560;
  ctx.save(); ctx.shadowColor = "rgba(0,0,0,.6)"; ctx.shadowBlur = 44; ctx.shadowOffsetY = 18;
  const pg = ctx.createLinearGradient(px,py,px+pw,py+ph); pg.addColorStop(0,"#F1EBDF"); pg.addColorStop(1,"#DDD4C4"); ctx.fillStyle = pg; ctx.fillRect(px,py,pw,ph); ctx.restore();
  if (img){ const lw = 480, lh = lw*LOGO_RATIO; ctx.drawImage(img, (W-lw)/2, py+(ph-lh)/2, lw, lh); }
  ctx.textAlign = "center"; ctx.fillStyle = "#ECE5D8"; ctx.font = "400 72px Forum, 'Times New Roman', serif"; lsp(ctx,"12px"); ctx.fillText("MC INFRASTRUCTURE", W/2, 1110);
  ctx.fillStyle = "rgba(236,229,216,.86)"; ctx.font = "400 50px Forum, 'Times New Roman', serif"; lsp(ctx,"4px"); ctx.fillText(cl.ru.toUpperCase(), W/2, 1200);
  const c2 = b.lang2==="de" ? cl.de : (b.lang2==="ro" ? cl.ro : "");

  ctx.fillStyle = "#E8821E"; ctx.font = "500 32px 'JetBrains Mono', monospace"; lsp(ctx,"2px");

}

  const prompt = kind==="shots"
    ? base + `Write a storyboard of 3 to 6 shots, each 2-8 seconds, totalling close to the target length. Shot 1 must stop the scroll in under 2 seconds. Each shot = one simple visual idea. No readable text, letters or logos in the image. Hands only in gloves with one simple action.\nUse ONLY these ids:\ntype: macro, hands, silhouette, topdown, timelapse, aerial, detail, wide, object\nlight: dawn, golden, sodium, overcast, lamp\nlens: macro100, ana35, wide24, tele85, drone\nmove: static, dollyin, push, slider, orbit, crane\nReply with only JSON: {"hooks":{"ru":["3 Russian options, max 6 words"],"de":["3 options"],"ro":["3 options"]},"shots":[{"desc":"short Russian description","type":"macro","light":"dawn","lens":"macro100","move":"push","laser":false,"subject":"one vivid English sentence describing subject and action","subjectRu":"the same sentence in Russian","audio":"English sound effects for this shot","audioRu":"the same in Russian","dur":4}]}`
    : base + `Write on-screen lines for this video: 5 Russian main lines (max 6 words, calm, confident, premium, natural spoken Russian, no bureaucratic language), plus 5 German and 5 Romanian lines that mean the same. Reply with only JSON: {"ru":["..."],"de":["..."],"ro":["..."]}`;
  try {
    const res = await S.sample.json(prompt,{signal:ctl.signal,onText:({text})=>{ const a=S.ai[v.id]; if(a&&a.busy){ a.chars=text.length; const el=$("#aiProg"); if(el) el.textContent="Пишет: "+text.length+" символов"; } }});
    S.ai[v.id] = {result: kind==="shots" ? (res||{}) : {hooks:res||{}}};
  } catch(e){
    const c = e&&e.code;
    const msg = {not_granted:"Доступ к Claude не разрешён. Разреши в окне запроса или пиши мне в чат.",sampling_disabled:"Claude недоступен для этого аккаунта.",rate_limited:"Лимит запросов. Попробуй позже.",invalid_json:"Ответ пришёл не в том формате. Нажми ещё раз.",refused:"Claude отказался. Перефразируй."}[c]||"Не получилось. Попробуй ещё раз.";
    S.ai[v.id] = c==="cancelled" ? null : {err:msg};
    if (c==="not_granted"||c==="sampling_disabled") S.sample = null;
  } finally { S.aiBusy = null; S.aiCtl = null; render(); }
}
async function trText(o, done){
  if (!S.sample || S.trBusy) return;
  if (!String(o.subjectRu||"").trim() && !String(o.audioRu||"").trim()){ toast("Сначала напиши по-русски, что в кадре"); return; }
  S.trBusy = o.id||"ctor"; render();
  try {
    const r = await S.sample.json(`Translate these Russian notes for one shot of a photorealistic commercial video into concise, vivid English for an AI image and video generator. Keep the meaning exactly, add nothing, no brand names. Reply only JSON {"subject":"...","audio":"..."} (empty string when a note is empty).\nsubject_ru: ${o.subjectRu||""}\naudio_ru: ${o.audioRu||""}`, {modelTier:"quick"});
    if (r && typeof r.subject==="string" && r.subject.trim()) o.subject = r.subject.trim();
    if (r && typeof r.audio==="string" && String(o.audioRu||"").trim()) o.audio = r.audio.trim();
    done(); toast("Переведено — промпт обновлён");
  } catch(e){
    const c = e&&e.code; toast(c==="rate_limited"?"Лимит запросов, попробуй позже":"Не получилось перевести");
    if (c==="not_granted"||c==="sampling_disabled") S.sample = null;
  } finally { S.trBusy = null; if (editing()) S.pending = true; else render(); }
}
function applyAI(v){
  const r = (S.ai[v.id]||{}).result; if (!r||!Array.isArray(r.shots)) return;
  v.shots = r.shots.slice(0,8).map(s=>newShot({desc:String(s.desc||""), type:pickId(TYPES,s.type,"detail"), light:pickId(LIGHTS,s.light,"dawn"), lens:pickId(LENSES,s.lens,"ana35"), move:pickId(MOVES,s.move,"static"), laser:!!s.laser, subject:String(s.subject||""), subjectRu:String(s.subjectRu||""), audio:String(s.audio||""), audioRu:String(s.audioRu||""), dur:Math.max(2,Math.min(8,Number(s.dur)||5))}));
  vSave(v,0); toast("Кадры взяты"); render();
}

document.addEventListener("click", ev=>{
  const a = ev.target.closest("[data-act]"); if (!a) return;
  if (a.tagName==="INPUT"||a.tagName==="SELECT") return;
  const act = a.dataset.act, v = a.dataset.id ? vById(a.dataset.id) : null;
  const s = (v && a.dataset.shot) ? (v.shots||[]).find(x=>x.id===a.dataset.shot) : null;
  switch(act){
    case "order": { const o = orders()[Number(a.dataset.i)]; if (!o) break;
      if (o.go==="prod"){ S.vid = o.vid; S.stageOf[o.vid] = o.stage; go("prod"); }
      else if (o.go==="route"){ S.routeAt = o.step; go("route"); }
      break; }
    case "pick-vid": S.vid = a.dataset.id; S.confirm = null; render(); break;
    case "to-prod": S.vid = a.dataset.id; go("prod"); break;
    case "q": qAdd(a.dataset.k, Number(a.dataset.d)); if (S.view==="ops") render(); else { const el = $(".strip"); if (el) el.outerHTML = rStrip(); rSave(); tick(); toast("+1 к лимиту дня"); } break;
    case "stage": S.stageOf[S.vid] = a.dataset.s; render(); window.scrollTo({top:0}); break;
    case "stage-prev": case "stage-next": { const vv = vById(S.vid); if (!vv) break; const i = STAGES.findIndex(x=>x.id===curStage(vv)); const j = i+(act==="stage-prev"?-1:1); if (j>=0&&j<STAGES.length){ S.stageOf[vv.id] = STAGES[j].id; render(); window.scrollTo({top:0}); } break; }
    case "stage-done": { const vv = vById(S.vid); if (!vv) break; const cs = curStage(vv); vv.stages = vv.stages||{}; const was = !!vv.stages[cs]; vv.stages[cs] = !was; vSave(vv,0);
      if (!was){ const i = STAGES.findIndex(x=>x.id===cs); toast("Этап «"+STAGES[i].n+"» закрыт"); if (i<STAGES.length-1){ S.stageOf[vv.id] = STAGES[i+1].id; window.scrollTo({top:0}); } }
      renderAll(); break; }
    case "add-shot": { v.shots = v.shots||[]; const ns = newShot(); v.shots.push(ns); S.openShots.add(v.id+":"+ns.id); vSave(v); render(); break; }
    case "toggle-shot": { const k = v.id+":"+a.dataset.shot; S.openShots.has(k)?S.openShots.delete(k):S.openShots.add(k); render(); break; }
    case "shot-mv": { const i = v.shots.findIndex(x=>x.id===a.dataset.shot), j = i+Number(a.dataset.d); if (i<0||j<0||j>=v.shots.length) break; [v.shots[i],v.shots[j]] = [v.shots[j],v.shots[i]]; vSave(v); render(); break; }
    case "shot-del": if (S.confirm==="shot:"+a.dataset.shot){ S.confirm=null; v.shots = v.shots.filter(x=>x.id!==a.dataset.shot); vSave(v); render(); } else { S.confirm="shot:"+a.dataset.shot; render(); setTimeout(()=>{ if(S.confirm==="shot:"+a.dataset.shot){ S.confirm=null; if(!editing()) render(); } },4000); } break;
    case "shot-ok": if (s){ const k = a.dataset.k; const ok = k==="kf" ? ["kf","clip","done"].includes(s.status) : ["clip","done"].includes(s.status); s.status = ok ? (k==="kf"?"todo":"kf") : (k==="kf"?"kf":"clip"); vSave(v); render(); } break;
    case "publish": v.published = !v.published; v.publishedAt = v.published ? today() : ""; if (v.published){ v.stages = v.stages||{}; v.stages.air = true; toast(vcode(v)+" в эфире"); } vSave(v,0); renderAll(); break;
    case "copy": { const el = document.getElementById(a.dataset.src); if (el) copy(el.textContent); break; }
    case "copy-text": copy(a.dataset.text||""); break;
    case "copy-all": { const L = S.state.promptLang; copy((v.shots||[]).map((x,i)=>`===== S${i+1} · ${x.desc||""} =====\n--- ${L==="ru"?"КЛЮЧЕВОЙ КАДР":"KEYFRAME"} ---\n${kfPrompt(x,L)}\n\n--- ${L==="ru"?"ВИДЕО":"VIDEO"} ---\n${vidPrompt(x,L)}`).join("\n\n")); break; }
    case "ai": aiRun(v, a.dataset.k); break;
    case "ai-stop": if (S.aiCtl) S.aiCtl.abort(); break;
    case "ai-close": S.ai[v.id] = null; render(); break;
    case "ai-apply": applyAI(v); break;
    case "take": v[a.dataset.f] = a.dataset.text; vSave(v); toast("Строка взята"); render(); break;
    case "hook-lang": S.hookLang = a.dataset.l; render(); break;
    case "ctor-add": { const sv = $("#ctorVid"); const target = sv ? vById(sv.value) : null; if (!target) break; const c = S.ctor;
      target.shots = target.shots||[]; target.shots.push(newShot({desc:String(c.subjectRu||"Из конструктора").slice(0,70), type:c.type, light:c.light, lens:c.lens, move:c.move, laser:c.laser, subject:c.subject, subjectRu:c.subjectRu||"", audio:c.audio, audioRu:c.audioRu||"", dur:Number(c.dur)||5})); vSave(target,0); toast("Кадр добавлен в "+vcode(target)); break; }
    case "dl-logo": (async()=>{ const k = a.dataset.k; if (k==="svg") await saveFile("mc-infrastructure-logo.svg", LOGO_ORIG); else await saveFile({clear:"mc-logo-transparent.png",plate:"mc-logo-plate.png",avatar:"mc-avatar.png"}[k]||"mc-logo.png", await logoPng(k)); })(); break;
    case "dl-canvas": (async()=>{ const cv = a.dataset.k==="hook" ? $("#cvHook") : $("#cvEnd"); if (!cv||!v) return; await saveFile(`${vcode(v)}_${a.dataset.k==="hook"?"titr":"endcard"}.png`, await canvasBlob(cv)); })(); break;
    case "timer":
      if (S.timer.run){ clearInterval(S.timer.h); S.timer.run=false; }
      else { if (S.timer.left===0) S.timer.left=1800; S.timer.run=true; S.timer.h=setInterval(()=>{ S.timer.left=Math.max(0,S.timer.left-1); const el=$("#timerOut"); if (el) el.textContent=pad2(Math.floor(S.timer.left/60))+":"+pad2(S.timer.left%60); if (S.timer.left===0){ clearInterval(S.timer.h); S.timer.run=false; toast("30 минут вышли. Закрой ленту."); if (S.view==="intel"&&!editing()) render(); } },1000); }
      render(); break;
    case "timer-reset": clearInterval(S.timer.h); S.timer={left:1800,run:false,h:null}; render(); break;
    /* маршрут */
    case "os": S.state.os = a.dataset.os==="win" ? "win" : "mac"; queueSave("state",0); render(); if (CH.open) rChatCtx(); break;
    case "route-mod": { const mm = ROUTE.find(x=>x.id===a.dataset.m); if (!mm) break; const st = mm.steps.find(x=>!routeDone(x))||mm.steps[0]; S.routeAt = st.id; S.state.routeAt = st.id; queueSave("state",1500); render(); break; }
    case "route-go": S.routeAt = a.dataset.id; S.state.routeAt = a.dataset.id; queueSave("state",1500); render(); toCard(); break;
    case "route-prev": { const f = flatRoute(), i = f.findIndex(x=>x.id===routeCur().id); if (i>0){ S.routeAt = f[i-1].id; S.state.routeAt = S.routeAt; queueSave("state",1500); render(); toCard(); } break; }
    case "route-done": { const cur = routeCur(); if (!cur) break; const was = routeDone(cur);
      if (cur.stage){ const vv = v01(); if (!vv){ toast("Ролик V01 ещё не загрузился"); break; } vv.stages = vv.stages||{}; vv.stages[cur.stage] = !was; vSave(vv,0); }
      else S.state.route[cur.id] = !was;
      if (!was){ const f = flatRoute(), i = f.findIndex(x=>x.id===cur.id), nx = f.slice(i+1).find(x=>!routeDone(x)) || f[i+1]; if (nx){ S.routeAt = nx.id; S.state.routeAt = nx.id; } toast("Шаг "+cur.num+" пройден"); }
      queueSave("state",0); renderAll(); toCard(); break; }
    case "route-prod": { const vv = v01(); if (!vv){ toast("Ролики ещё загружаются"); break; } S.vid = vv.id; S.stageOf[vv.id] = a.dataset.s; go("prod"); break; }
    case "route-help": { const c = routeCur(); chatOpen("Шаг "+c.num+" «"+c.t+"». Не получается: ", false); break; }
    case "quiz": { const q = S.quiz || (S.quiz = newQuiz()); const i = Number(a.dataset.i);
      if (i===q.ok.length){ q.ok.push(i); if (q.ok.length===8){ if (!q.miss){ q.wins++; toast(q.wins>=2?"Два раза подряд без ошибок — формула в голове":"Чисто! Ещё раз — и формула твоя"); } else toast("Собрано. Теперь без ошибок"); } }
      else { const prev = q.ok.length ? FORMULA[q.ok.length-1].m : null; toast(prev ? "Мимо: после «"+prev+"» идёт другой этап" : "Мимо: всё начинается с заказа"); q.miss++; q.wins = 0; }
      render(); break; }
    case "quiz-reset": S.quiz = newQuiz(); render(); break;
    case "md-dl": saveFile("Monolith_metodichka.md", buildMd()); break;
    case "md-copy": copy(buildMd()); break;
    case "issue-ok": { const id = a.dataset.id;
      if (S.mode==="db" && S.db) S.db.collection("issues").doc(id).update({resolved:true}).catch(()=>toast("Не сохранилось"));
      else { const x = (S.issues||[]).find(i=>i.id===id); if (x){ x.resolved = true; try { localStorage.setItem("ms-monolith-issues", JSON.stringify(S.issues)); } catch(e){} render(); } }
      break; }
    /* наставник */
    case "chat-open": chatOpen(a.dataset.text!=null ? a.dataset.text : null, !!a.dataset.send); break;
    case "chat-close": chatClose(); break;
    case "chat-send": chatSend(); break;
    case "chat-clear": if (CH.busy) break; CH.msgs = []; queueSave("chat",0); rChat(); break;
    case "chat-sug": $("#mIn").value = a.dataset.text||""; chatSend(); break;
    case "chat-attach": $("#mFile").click(); break;
    case "chat-img-del": { const i = Number(a.dataset.i), x = CH.imgs[i]; if (x){ URL.revokeObjectURL(x.url); CH.imgs.splice(i,1); rChat(); } break; }
    case "chat-copy": copy(chatForClaude()); break;
    case "explain": { const el = document.getElementById(a.dataset.src); if (!el) break; chatOpen(`Объясни простыми словами, что значит «${a.dataset.label||"этот текст"}»: зачем каждая строчка и что изменится, если поменять свет или объектив.\n\n${el.textContent.slice(0,2500)}`, true); break; }
    case "plang": S.state.promptLang = a.dataset.l==="ru" ? "ru" : "en"; queueSave("state",0); render(); break;
    case "style-reset": if (S.state.style) delete S.state.style[a.dataset.k]; queueSave("state",0); render(); toast("Блок возвращён к исходному"); break;
    case "tr-shot": if (s) trText(s, ()=>vSave(v,0)); break;
    case "tr-ctor": trText(S.ctor, updCtor); break;
  }
});
function toCard(){ requestAnimationFrame(()=>{ const el = $(".rcard"); if (el && (el.getBoundingClientRect().top<0 || el.getBoundingClientRect().top>window.innerHeight*0.6)) el.scrollIntoView({block:"start"}); }); }
document.addEventListener("keydown", ev=>{
  const t = ev.target;
  if (ev.key==="Escape" && CH.open){ chatClose(); return; }
  if (ev.metaKey||ev.ctrlKey||ev.altKey) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
  const blk = t.closest && t.closest("g[data-act='pick-vid']");
  if (blk && (ev.key==="Enter"||ev.key===" ")){ ev.preventDefault(); S.vid = blk.dataset.id; render(); return; }
  if (/^[1-8]$/.test(ev.key)){ go(SECTIONS[Number(ev.key)-1][0]); return; }
  if (S.view==="prod" && (ev.key==="ArrowLeft"||ev.key==="ArrowRight")){ const v = vById(S.vid); if (!v) return; const i = STAGES.findIndex(x=>x.id===curStage(v)); const j = i+(ev.key==="ArrowLeft"?-1:1); if (j>=0&&j<STAGES.length){ S.stageOf[v.id]=STAGES[j].id; render(); } }
});
document.addEventListener("change", ev=>{
  const t = ev.target;
  if (t.dataset.act==="tool"){ const id=t.dataset.id, cur=S.state.tools[id]||{}, nx=Object.assign({},cur,{bought:t.checked}); if (t.checked&&!cur.cancelBy){ const d=new Date(); d.setDate(d.getDate()+29); nx.cancelBy=d.toISOString().slice(0,10); } S.state.tools[id]=nx; queueSave("state"); renderAll(); return; }
  if (t.dataset.act==="chk"){ const v=vById(t.dataset.id); if(!v) return; v.checks=v.checks||{}; v.checks[t.dataset.k]=v.checks[t.dataset.k]||{}; v.checks[t.dataset.k][t.dataset.i]=t.checked; vSave(v); render(); return; }
  if (t.dataset.act==="micro"){ const m = S.state.micro[t.dataset.id] = Object.assign({}, S.state.micro[t.dataset.id]); m[t.dataset.i] = t.checked; queueSave("state"); render(); return; }
  if (t.dataset.act==="shot-laser"){ const v=vById(t.dataset.v); const s=v&&(v.shots||[]).find(x=>x.id===t.dataset.shot); if(!s) return; s.laser=t.checked; vSave(v); render(); return; }
  if (t.dataset.ctor){ S.ctor[t.dataset.ctor] = t.type==="checkbox"?t.checked:t.value; updCtor(); return; }
  if (t.id==="ctorVid"){ S.ctor.vid = t.value; return; }
  if (t.dataset.st && t.type==="checkbox"){ stSet(t.dataset.st, t.checked); renderAll(); return; }
  if (t.tagName==="SELECT" && (t.dataset.st||t.dataset.v)){ handleInput(t); renderAll(); return; }
  if (t.type==="date"){ handleInput(t); setTimeout(()=>{ if(!editing()) renderAll(); },0); return; }
  if (/^(INPUT|TEXTAREA)$/.test(t.tagName)) setTimeout(()=>{ if(!editing()) renderAll(); },300);
});
document.addEventListener("input", ev=>{
  const t = ev.target;
  if (t.id==="gq"){ S.gq = t.value; const g = $("#glossList"); if (g) g.innerHTML = glossItems(); return; }
  if (t.dataset.ctor){ if (t.type!=="checkbox" && t.tagName!=="SELECT"){ S.ctor[t.dataset.ctor] = t.value; updCtor(); } return; }
  if (t.type==="checkbox"||t.tagName==="SELECT"||t.type==="date") return;
  handleInput(t);
});
function updCtor(){
  const cp = ctorPrompt(), ru = S.state.promptLang==="ru";
  const a = $("#ctor-kf"), b = $("#ctor-vid"), ta = $("#ctor-kf-tr"), tb = $("#ctor-vid-tr");
  if (a) a.textContent = ru ? cp.kfRu : cp.kf; if (b) b.textContent = ru ? cp.vidRu : cp.vid;
  if (ta) ta.textContent = cp.kfRu; if (tb) tb.textContent = cp.vidRu;
  if (!editing()){ const sv = document.querySelector('[data-ctor="subject"]'); if (sv && sv.value!==S.ctor.subject) sv.value = S.ctor.subject; const av = document.querySelector('[data-ctor="audio"]'); if (av && av.value!==S.ctor.audio) av.value = S.ctor.audio; }
}
function handleInput(t){
  if (t.dataset.st){ let val = t.value; if (t.type==="number") val = val===""?null:Number(val); stSet(t.dataset.st, val); return; }
  const v = t.dataset.v ? vById(t.dataset.v) : null; if (!v) return;
  if (t.dataset.metric){ v.metrics = v.metrics||{}; v.metrics[t.dataset.metric] = t.value===""?null:Number(t.value); vSave(v,900); return; }
  if (t.dataset.vo){ v.voice = Object.assign({mode:"none"}, v.voice||{}); v.voice[t.dataset.vo] = t.value; vSave(v); return; }
  const f = t.dataset.f; if (!f) return; let val = t.value; if (t.type==="number") val = val===""?null:Number(val);
  if (t.dataset.shot){ const s = (v.shots||[]).find(x=>x.id===t.dataset.shot); if (!s) return; s[f] = val; } else v[f] = val;
  vSave(v);
  if (S.view==="prod" && curStage(v)==="edit") afterRender();
}
document.addEventListener("focusout", ()=>{ setTimeout(()=>{ if (S.pending && !editing()) renderAll(); },300); });
function route(){ const h = (location.hash||"").replace("#",""); S.view = SECTIONS.some(s=>s[0]===h) ? h : "route"; }
window.addEventListener("hashchange", ()=>{ route(); S.confirm=null; renderAll(); window.scrollTo(0,0); });
(function bindChat(){
  const inp = $("#mIn"), file = $("#mFile");
  inp.addEventListener("keydown", e=>{ if (e.key==="Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); chatSend(); } });
  inp.addEventListener("paste", e=>{ const fs = [...((e.clipboardData && e.clipboardData.files) || [])].filter(f=>/^image\//.test(f.type)); if (!fs.length) return; e.preventDefault(); if (CH.canImg) addImgs(fs); else toast("Скриншоты Наставник видит в штабе на claude.ai"); });
  file.addEventListener("change", ()=>{ addImgs([...(file.files||[])]); file.value = ""; });
})();
boot();
</script>
